   di servizio, non di una battuta narrata. */
/* Due schermate hanno la stessa forma: la cornice, l'investigatore, e le righe
   che dice. Cambiano la posa, una classe e quante righe sono. */
const renderNarration = (classe, posa, alt, righe) => `<div class="${["sheet", "narr-fine", classe, "centrata"].filter(Boolean).join(" ")}">
    ${detectiveFigure(posa, alt)}
    <div class="detto">${righe.map(r => `<p>${escapeHtml(r)}</p>`).join("")}</div>
  </div>`;

const renderNotice = () =>
  renderNarration("avviso", "detective_presentazione.png", "L’investigatore si presenta", [STORY.disclaimer]);

function renderCast() {
  const c = STORY.personaggi.map(p => `
    <article class="card slot centrata" data-c="${escapeHtml(p.c)}">
      ${optionalImage(portraitImage(p.c), "ritratto", p.n)}
      <div class="ph ph-cifra ritratto">${escapeHtml(p.c[0])}</div>
      <div class="testo">
        <h2 class="titolo-carta">${escapeHtml(p.n)}</h2>
        <p>${escapeHtml(p.d)}</p>
      </div>
      ${advanceButton()}
    </article>`).join("");
  return `<div class="sheet">
    <div class="cast">${c}</div>
  </div>`;
}

/* Chi parla due volte di fila non prende due riquadri: il suo si allunga.
   L'inciso fa testo - "tra se'" dopo una battuta detta a voce alta e' un altro
   momento - quindi un inciso diverso apre comunque un riquadro nuovo. */
const groupLines = battute => battute.reduce((gr, b) => {
  const ultimo = gr[gr.length - 1];
  if (ultimo && ultimo[0].c === b.c && (ultimo[0].m || "") === (b.m || "")) ultimo.push(b);
  else gr.push([b]);
  return gr;
}, []);

const renderBubble = righe => {
  const b = righe[0];
  return `
    <div class="bubble" data-c="${escapeHtml(b.c)}">
      <div class="who">${escapeHtml(b.c)}${b.m ? `<small>${escapeHtml(b.m)}</small>` : ""}</div>
      <div class="said">${righe.map(r => `<p>${escapeHtml(r.t)}</p>`).join("")}</div>
    </div>`;
};

function renderScene(i) {
  const s = STORY.scene[i];
  const attivo = state.step > 0 ? s.battute[state.step - 1].c : null;  // chi ha appena parlato viene avanti
  /* Le parti di una stessa scena non azzerano il tavolo: quello che e' gia'
     stato detto resta sotto, e una riga segna il punto in cui entra il nuovo
     set di attori. */
  const gruppi = [s.battute.slice(0, state.step)];
  for (let k = i - 1; k >= 0 && sceneNumber(STORY.scene[k], k) === sceneNumber(s, i); k--)
    gruppi.push(STORY.scene[k].battute);
  const shown = gruppi.map(g => groupLines(g).reverse().map(renderBubble).join("")).join(`<hr class="atto">`);

  return `<div class="sheet scena-doppia">
    <div class="alto">
    ${TITLES_ENABLED ? `<header class="scene-head"><h2 class="titolo">${escapeHtml(s.titolo)}</h2></header>` : ""}
    <div class="palco-box">
    <div class="slot plate scena carta">
      <div class="palco">
        ${optionalImage(sceneImage(i), "sfondo", `Scena ${sceneNumber(s, i)}`, s.sfondo
          ? `transform:scale(${s.sfondo.scala}); transform-origin:${s.sfondo.fx}% ${s.sfondo.fy}%` : "")}
        ${(s.cast || []).map(a => `<img class="attore ${a.c === attivo ? "attivo" : ""}" src="${escapeHtml(actorImage(a.c, i))}" alt="" style="left:${a.x}%; bottom:${a.b}%; height:${a.h}%${a.z === undefined ? "" : `; z-index:${a.z}`}">`).join("")}
        ${(s.primo || []).map(o => `<img class="primo" src="${escapeHtml(assetSource(`${backgroundSlot(i)}_${o.lato}.png`))}" alt="" style="left:${o.x}%; bottom:${o.b}%; height:${o.h}%${o.z === undefined ? "" : `; z-index:${o.z}`}">`).join("")}
      </div>
      <div class="ph">
        <p class="brief-label">${LEAF}<span>Brief illustrazione</span></p>
      </div>
    </div>
    </div>
    </div>
    <div class="basso">
      <div class="parlante slot" data-c="${escapeHtml(attivo || "")}">${attivo ? `
        ${optionalImage(actorImage(attivo, i), "figura-parlante", attivo)}
        <div class="ph ph-cifra sigla">${escapeHtml(attivo[0])}</div>` : ""}
      </div>
      <div class="dialoghi">
        <div class="azioni-scena"></div>
        <div class="bubbles" id="bubbles">${shown}</div>
      </div>
    </div>
  </div>`;
}

/* La vittima non risponde: i sospetti sono tutti gli altri. */
const VICTIM = "Giuseppe";
const SUSPECTS = STORY.personaggi.map(p => p.c).filter(c => c !== VICTIM);
const remainingClues = () => MAX_CLUES - state.indagine.scelti.length;
const askedPeople = i => state.indagine.chiesto[i] || [];
/* L'indagine e' completa quando entrambi gli oggetti sono stati scelti e su
   ognuno si e' interrogato tutte le persone che si potevano interrogare. */
const investigationComplete = () => state.indagine.scelti.length >= MAX_CLUES
  && state.indagine.scelti.every(i => askedPeople(i).length >= MAX_PEOPLE);

function renderClue(i) {
  const o = STORY.oggetti[i];
  const chiesti = askedPeople(i);
  const finite = chiesti.length >= MAX_PEOPLE;
  /* i quattro sospetti sempre tutti in vista: chi ha gia' risposto resta
     acceso col suo colore, chi non si puo' piu' interrogare si spegne */
  const scelta = SUSPECTS.map(c => {
    const fatto = chiesti.includes(c);
    const spento = !fatto && finite;
    return suspectCard(c, { dati: `data-chiedi="${escapeHtml(c)}"`, spento,
      classi: `voce ${fatto ? "fatto" : ""} ${spento ? "" : "sollevabile"}` });
  }).join("");
  /* sotto la risposta, in piccolo, quello che quella persona ha gia' detto in
     scena su questo oggetto: all'investigatore serve il collegamento */
  const risposte = chiesti.map(c => {
    const detto = o.refs.filter(r => r.c === c).map(r =>
      `<li>Scena ${r.s}: «${escapeHtml(r.t)}»</li>`).join("");
    return `
      <div class="risposta" data-c="${escapeHtml(c)}">
        <p class="src slot">${optionalImage(faceImage(c), "volto-mini", c)}<span
          class="ph ph-cifra volto-mini">${escapeHtml(c[0])}</span>${escapeHtml(c)}</p>
        <p>${escapeHtml(o.risposte[c])}</p>
        ${detto ? `<ul class="gia-detto">${detto}</ul>` : ""}
      </div>`;
  }).join("");
  return `<div class="sheet indagine">
    <p class="eyebrow">L’indagine</p>
    <div class="detail carta">
      <figure class="slot">
        ${optionalImage(clueImage(i), "", o.nome)}
        <div class="ph">${LEAF}</div>
      </figure>
      <h2 class="titolo-carta">${escapeHtml(o.nome)}</h2>
      <p class="eyebrow">${escapeHtml(o.tag)}</p>
      <p>${escapeHtml(o.d)}</p>
      <p class="nota">${finite
        ? "Hai già chiesto a due persone. Le altre, su questo oggetto, non parleranno."
        : "Non hai tempo per chiedere a tutti: scegli <b>due</b> persone a cui chiedere informazioni."}</p>
      <div class="opts chiedi">${scelta}</div>
      ${risposte ? `<div class="refs">${risposte}</div>` : ""}
    </div>
    <p><button class="btn" data-clue="close">← Torna al tavolo</button></p>
  </div>`;
}

function renderClueTable() {
  if (state.clue !== null) return renderClue(state.clue);
  const { scelti, chiesto } = state.indagine;
  const cards = STORY.oggetti.map((o, i) => {
    const culpritFound = scelti.includes(i);
    const fuori = !culpritFound && remainingClues() === 0;
    return `
    <button class="clue slot carta ${fuori ? "fuori" : "sollevabile"}" data-clue="${i}" ${fuori ? "disabled" : ""}>
      <figure>
        ${optionalImage(clueImage(i), "", o.nome)}
        <div class="ph">${LEAF}</div>
      </figure>
      <h3>${escapeHtml(o.nome)}</h3>
      <span class="tag">${escapeHtml(o.tag)}</span>
      ${culpritFound ? `<span class="stato">${chiesto[i]?.length
        ? `Hai chiesto a ${chiesto[i].map(c => `<b data-c="${escapeHtml(c)}">${escapeHtml(c)}</b>`).join(" e ")}`
        : "Scelto · a chi lo chiedi?"}</span>` : ""}
    </button>`;
  }).join("");
  const rimasti = remainingClues();
  return `<div class="sheet indagine">
    <div class="apertura">
      ${detectiveFigure("detective_osservazione.png", "L’investigatore osserva")}
      <div>
        <p class="eyebrow">L’indagine</p>
        <h2 class="titolo">Gli indizi sul tavolo</h2>
        <p class="nota">${rimasti === MAX_CLUES
      ? `Quattro oggetti, ma puoi chiedere solo di <b>${MAX_CLUES}</b>. Scegli con calma.`
      : rimasti
        ? `Ti resta <b>una</b> domanda. Scegliela bene.`
        : `Le tue domande sono finite. Quello che non hai chiesto resta fuori dal caso.`}</p>
      </div>
    </div>
    <div class="clues">${cards}</div>
  </div>`;
}

/* Il riepilogo non porta etichetta: chi parla si vede, ed e' lui che riempie
   lo schermo. */
const renderDetective = () =>
  renderNarration("", "detective_riflessione.png", "L’investigatore riflette", STORY.investigatoreFinale);

/* L'investigatore in cima a una schermata: cinque viste disegnavano lo stesso
   riquadro, immagine piu' ripiego. */
const detectiveFigure = (posa, alt) =>
  `<div class="slot guida">${optionalImage(assetSource(posa), "", alt)}<div class="ph ph-cifra">?</div></div>`;

/* La carta di un sospetto — volto sotto il nome — la usano la scheda finale e
   le persone a cui chiedere su un indizio: cambiano la lettera davanti, il
   `data-*` che porta e lo stato, non la carta. */
const suspectCard = (nome, { dati = "", classi = "", lettera = "", spento = false } = {}) =>
  `<button class="opt carta slot ${classi}" ${dati} data-c="${escapeHtml(nome)}"${spento ? " disabled" : ""}>
      <span class="riga">${lettera ? `<span class="k">${lettera}</span>` : ""}<span class="v">${escapeHtml(nome)}</span></span>
      ${optionalImage(faceImage(nome), "volto", nome)}
      <span class="ph ph-cifra volto">${escapeHtml(nome[0])}</span>
    </button>`;

const LETTER = k => String.fromCharCode(65 + k);
const faceImage = c => assetSource(`volto_${c.toLowerCase()}.png`);
/* La scheda finale e' una pagina sola: si risponde e la domanda successiva
   compare sotto, spingendo in alto quelle gia' chiuse. */
const currentQuestion = () => STORY.quiz.findIndex((_, i) => state.risposte[i] === undefined);

function renderQuestion(i, corrente) {
  const q = STORY.quiz[i];
  const dato = state.risposte[i];
  /* Una domanda chiusa dice solo chi e' stato accusato: se fosse giusta, e
     quanto vale, si scopre alla fine. Il verdetto arriva tutto in una volta. */
  if (!corrente) return `<li class="fatta">
      <p class="q">${escapeHtml(q.q)}</p>
      <p class="data" data-c="${escapeHtml(SUSPECTS[dato])}">${escapeHtml(SUSPECTS[dato])}</p>
    </li>`;
  const opts = SUSPECTS.map((o, k) =>
    suspectCard(o, { dati: `data-opt="${k}"`, classi: "sollevabile", lettera: LETTER(k) })).join("");
  return `<li class="corrente">
    <p class="eyebrow">Domanda ${i + 1} di ${STORY.quiz.length}</p>
    <h2>${escapeHtml(q.q)}</h2>
    <div class="opts">${opts}</div>
  </li>`;
}

function renderQuiz() {
  const corrente = currentQuestion();
  const fino = corrente === -1 ? STORY.quiz.length : corrente + 1;
  const lista = STORY.quiz.slice(0, fino)
    .map((_, i) => renderQuestion(i, i === corrente)).join("");
  return `<div class="sheet quiz">
    <p class="eyebrow">Scheda finale</p>
    <ol class="domande">${lista}</ol>
  </div>`;
}

const TOTAL_POINTS = STORY.quiz.reduce((n, q) => n + q.punti, 0);
const CULPRIT_QUESTION = STORY.quiz.length - 1;      // l'ultima domanda e' quella che conta

/* Il verdetto guarda due cose: se il nome e' quello giusto, e quanto regge la
   ricostruzione attorno. Le fasce coprono ogni punteggio possibile: senza i
   tre punti del colpevole non si va oltre sette. */
function verdict(punti, culpritFound) {
  if (culpritFound && punti === TOTAL_POINTS) return {
    t: "Caso risolto perfettamente",
    d: "Hai indicato il colpevole e ogni dettaglio della serata è al suo posto." };
  if (culpritFound && punti >= 6) return {
    t: "Caso risolto, ma qualcosa non torna",
    d: "Il nome è quello giusto. Su qualche passaggio, però, la ricostruzione balla." };
  if (culpritFound) return {
    t: "Caso risolto?",
    d: "Hai indicato la persona giusta, ma senza abbastanza prove: così non reggerebbe." };
  if (punti >= 6) return {
    t: "I dettagli sono chiari, ma qualcosa non torna",
    d: "Hai ricostruito quasi tutta la serata — e poi hai accusato la persona sbagliata." };
  return {
    t: "Qualcosa non torna",
    d: "Il colpevole è un altro, e anche i fatti attorno restano da mettere in ordine." };
}

/* Il verdetto sta da solo: quanto regge la ricostruzione, e nient'altro. La
   soluzione arriva dopo, su una schermata sua, perche' leggerla accanto al
   punteggio la faceva sembrare la correzione di un compito. */
/* La posa dice l'esito prima delle parole: in piedi con la soluzione in mano
   se e' tutto giusto, con la lente se il nome e' quello giusto e la
   ricostruzione regge, altrimenti quella di chi ci sta ancora pensando. */
const score = () =>
  state.risposte.reduce((n, r, i) => n + (r === STORY.quiz[i].giusta ? STORY.quiz[i].punti : 0), 0);
const culpritFound = () => state.risposte[CULPRIT_QUESTION] === STORY.quiz[CULPRIT_QUESTION].giusta;

function verdictPose(punti, date) {
  if (date && culpritFound() && punti === TOTAL_POINTS) return "detective_soluzione.png";
  if (date && culpritFound() && punti >= 6) return "detective_osservazione.png";
  return "detective_riflessione.png";
}

function renderResult() {
  const punti = score();
  const date = state.risposte.filter(r => r !== undefined).length;
  const v = verdict(punti, culpritFound());
  return `<div class="sheet centrata verdetto">
    ${detectiveFigure(verdictPose(punti, date), "L’investigatore")}
    ${date ? `<p class="score">${punti} <small>su ${TOTAL_POINTS}</small></p>
      <div class="giudizio"><h2>${escapeHtml(v.t)}</h2><p>${escapeHtml(v.d)}</p></div>`
      : `<p class="vuoto">La scheda è rimasta in bianco: nessuna accusa.</p>`}
  </div>`;
}

/* L'ultima schermata: l'investigatore che ha capito, il racconto di com'e'
   andata, e la parola Fine. Non porta altrove, quindi non ha pulsante. */
function renderEnding() {
  return `<div class="sheet centrata fine-caso">
    ${detectiveFigure("detective_scoperta.png", "L’investigatore ha risolto il caso")}
    <div class="solution">${STORY.soluzione.map(r => `<p>${escapeHtml(r)}</p>`).join("")}</div>
    <div class="congedo">
      <div class="rule"></div>
      <p class="parola">Fine</p>
    </div>
  </div>`;
}

const REDUCED_MOTION = matchMedia("(prefers-reduced-motion:reduce)");
const scrollBehavior = () => REDUCED_MOTION.matches ? "auto" : "smooth";
const cards = () => stage.querySelectorAll(".card");

/* ---- render ----
   Una schermata per tipo: aggiungerne una vuol dire scrivere la sua vista e
   metterla qui, non allungare una catena di condizioni. */
const VIEWS = {
  cover: renderCover, avviso: renderNotice, cast: renderCast, tavolo: renderClueTable, narr: renderDetective, sol: renderResult, fine: renderEnding,
  scene: s => renderScene(s.i), quiz: renderQuiz
};

function render() {
  const s = SLIDES[state.n];
  const scena = s.t === "scene";
  stage.innerHTML = VIEWS[s.t](s);
  /* la scena si porta il posto dove il pulsante deve stare; le altre schermate
     lo prendono in fondo al foglio. I personaggi ne mettono uno per scheda e
     se lo disegnano da soli: qui non si aggiunge niente. */
  if (!stage.querySelector("[data-avanti]"))
    (stage.querySelector(".azioni-scena") || stage.querySelector(".sheet"))
      ?.insertAdjacentHTML("beforeend", advanceButton());
  setupImageSlots(stage);

  if (state.directorMode && scena) activateDirector(s.i);
  else directorPanel = closePanel(directorPanel);
  if (state.developmentMode) renderDeveloperPanel();

  visibilityObserver?.disconnect();
  if (visibilityObserver) { stage.classList.add("dissolve"); cards().forEach(c => visibilityObserver.observe(c)); }

  /* la battuta appena scoperta compare al ritmo della voce che la dice */
  if (scena && state.step > 0) {
    const b = STORY.scene[s.i].battute[state.step - 1];
    animateSpeech(stage.querySelector(".bubbles .bubble .said p:last-child"), b.c, b.t);
  }

  /* la battuta appena scoperta si porta da sola sotto gli occhi dell'investigatore.
     Dopo l'impaginazione: partendo subito, le altezze non sono ancora quelle
     definitive e la battuta nuova restava sotto il bordo. */
  if (scena && state.step > 0)
    requestAnimationFrame(() => stage.querySelector(".bubbles")?.scrollTo({ top: 0, behavior: scrollBehavior() }));
  /* la domanda appena aperta si mostra da sola, senza far sparire quelle chiuse */
  if (s.t === "quiz")
    requestAnimationFrame(() => stage.querySelector(".corrente")
      ?.scrollIntoView({ block: "end", behavior: scrollBehavior() }));

  /* L'alone blu si accende alla prima battuta della scena del malore, non
     all'ultima: il colore deve arrivare insieme al fatto, non dopo. */
  stage.classList.toggle("stage-blu", scena && !!STORY.scene[s.i].blu && state.step >= 1);
}

/* Una scena non si apre mai muta: la prima battuta e' gia' scoperta, e la
   voce parte con lei. Aprire su una colonna vuota costava all'investigatore un
   gesto per far dire la prima parola a chi era gia' in scena. */
function goTo(n) {
  state.n = Math.max(0, Math.min(SLIDES.length - 1, n));
  state.clue = null;
  const s = SLIDES[state.n];
  const prima = s.t === "scene" && STORY.scene[s.i].battute.length ? STORY.scene[s.i].battute[0] : null;
  state.step = prima ? 1 : 0;
  if (prima) speak(prima.c, prima.t);
  render();
  /* una pagina nuova comincia dall'alto. Rimpiazzare il markup di solito basta,
     ma non sempre: lo scorrimento a scatti dei personaggi si riaggancia da se',
     e su un telefono la pagina intera puo' essere scesa sotto la barra. */
  stage.scrollTop = 0;
  document.scrollingElement?.scrollTo(0, 0);
}

/* Sulla pagina dei personaggi "avanti" scorre di una scheda: ogni scheda ha
   il suo pulsante sotto al testo, e premerlo porta al personaggio seguente.
   Dall'ultima non resta niente da scorrere, quindi la pagina si dichiara
   finita e a cambiarla ci pensa `avanti()`. */
function scrollCard(verso) {
  const c = cards();
  if (!c.length) return false;
  /* quale scheda si sta guardando: quella che comincia piu' vicino al bordo.
     Non si divide per l'altezza dello schermo — da telefono una scheda e' piu'
     alta di una schermata — e non si guarda "sopra il bordo": l'ultima scheda
     resta qualche pixel sotto, perche' non c'e' piu' scorrimento per portarla
     in cima, e la pagina non finiva mai. */
  const bordo = stage.getBoundingClientRect().top;
  let qui = 0, meglio = Infinity;
  c.forEach((x, k) => {
    const d = Math.abs(x.getBoundingClientRect().top - bordo);
    if (d < meglio) { meglio = d; qui = k; }
  });
  const i = qui + verso;
  if (i < 0 || i >= c.length) return false;
  c[i].scrollIntoView({ block: "start", behavior: scrollBehavior() });
  return true;
}

/* Due schermate sono la stessa scena quando portano lo stesso numero: le parti
   sono un taglio di regia, non un capitolo nuovo. */
const sameScene = (a, b) => !!a && !!b && a.t === "scene" && b.t === "scene"
  && sceneNumber(STORY.scene[a.i], a.i) === sceneNumber(STORY.scene[b.i], b.i);

/* Scopre quello che c'e' da scoprire *dentro la scena*: una battuta, la scheda
   successiva dei personaggi, e anche il passaggio alla parte seguente della
   stessa scena — quello e' un respiro, non un cambio di capitolo, e si fa col
   dito. Restituisce false quando resta solo un salto vero, che tocca al pulsante. */
function reveal() {
  const s = SLIDES[state.n];
  if (s.t === "cast") return scrollCard(1);
  if (s.t === "scene") {
    if (state.step < STORY.scene[s.i].battute.length) {
      state.step++;
      const b = STORY.scene[s.i].battute[state.step - 1];
      speak(b.c, b.t);
      render();
      return true;
    }
    if (sameScene(s, SLIDES[state.n + 1])) { goTo(state.n + 1); return true; }
    return false;
  }
  if (s.t === "tavolo" && state.clue !== null) { state.clue = null; render(); return true; }
  return false;
}

function advance() {
  if (reveal()) return;
  goTo(state.n + 1);
}

/* Un clic scopre, mai cambia pagina: a cambiarla c'e' un pulsante solo, sempre
   nello stesso angolo. Resta in vista per tutta la schermata, spento finche'
   c'e' ancora qualcosa da scoprire: cosi' si vede dove si sta andando, ma non
   ci si arriva prima del tempo. */
function hasMoreToReveal() {
  const s = SLIDES[state.n];
  if (s.t === "scene")
    return state.step < STORY.scene[s.i].battute.length || sameScene(s, SLIDES[state.n + 1]);
  if (s.t === "quiz") return currentQuestion() !== -1;
  if (s.t === "tavolo") return state.clue !== null;   // dall'indizio si torna prima al tavolo
  return false;
}

function advanceLabel() {
  const s = SLIDES[state.n], dopo = SLIDES[state.n + 1];
  if (!dopo) return null;                             // l'ultima non porta altrove
  if (s.t === "tavolo") return "Chiudi l’indagine";
  if (s.t === "narr") return "Alla scheda finale";
  if (s.t === "quiz") return "Scopri la soluzione";
  if (s.t === "sol") return "Vedi la soluzione";
  return "Prosegui";
}

/* Il pulsante sta nel flusso, non appiccicato a un angolo: in fondo ai dialoghi
   nelle scene, in fondo alla pagina altrove. Essendo dentro #stage viene
   riscritto a ogni render, quindi porta un `data-*` come tutti i suoi pari. */
function advanceButton() {
  const testo = advanceLabel();
  if (!testo) return "";
  /* Nella scena non si spegne mai: premerlo scopre la battuta seguente, come
     il clic, e cambia schermata solo quando non resta altro — `avanti()` prova
     `scopri()` per primo. Altrove resta spento finche' c'e' una scelta aperta,
     perche' li' saltarla costerebbe una domanda o una risposta. */
  const spento = hasMoreToReveal() && SLIDES[state.n].t !== "scene";
  return `<div class="azioni">
      <button class="btn primaria avanza" data-avanti="1"${spento ? " disabled" : ""}>${escapeHtml(testo)} →</button>
    </div>`;
}

/* Chiudere l'indagine a meta' non e' un passo qualunque: prima si chiede.
   Parla l'investigatore, non il regolamento — degli indizi non fa parola. */
/* `Ritenta` non e' un ripensamento, e' una partita nuova: riporta alla
   copertina e azzera quello che il ricaricamento azzerava prima — le risposte
   della scheda e l'indagine. Anche questo si chiede, perche' e' irreversibile. */
function restart() {
  confirmAction("Vuoi ricominciare da capo?",
    "Torni alla copertina, e le risposte della scheda e l’indagine si azzerano.",
    "Ricomincia", () => {
      state.risposte = [];
      state.indagine = createInvestigation();
      goTo(0);
    }, "Resta qui");
}

/* La soluzione si chiede due volte: dopo il verdetto la tentazione e' forte,
   e leggerla chiude la partita. */
function askForSolution() {
  confirmAction("Sei sicuro di voler vedere la soluzione?", "",
    "Vedi la soluzione", () =>
      confirmAction("Sei veramente sicuro di voler vedere la soluzione?", "",
        "Vedi la soluzione", advance, "Ritenta", restart),
    "Ritenta", restart);
}

function confirmAndAdvance() {
  if (SLIDES[state.n].t === "sol") return askForSolution();
  if (SLIDES[state.n].t === "tavolo" && !investigationComplete())
    return confirmAction("Giuseppe è morto durante la festa degli Oliviani.",
      "Quattro persone erano in quella stanza, e non tutte hanno raccontato la stessa sera. Vuoi chiudere qui, o c’è ancora qualcosa che vuoi sapere?",
      "Chiudo qui", advance);
  advance();
}


/* ---- prova a vuoto ----
   Finche' Codex non consegna, il tasto "d" riempie sfondi e personaggi con
   sagome piatte: servono a provare posizioni, ritmo ed evidenziazione, non
   a somigliare a qualcosa. Si spengono premendo di nuovo "d". */
const DEMO_COLORS = { giuseppe: "#DFA93C", rosalia: "#DA8FB2", roberto: "#9CB65C", augusto: "#78BFAA", mauro: "#7B96FF" };
const svgDataUri = t => "data:image/svg+xml;utf8," + encodeURIComponent(t);
const demoBackground = n => svgDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#232B1C"/><rect y="620" width="1600" height="280" fill="#463A26"/>
  <circle cx="800" cy="250" r="110" fill="#5E7233" opacity=".55"/>
  <text x="800" y="268" font-family="serif" font-size="90" fill="#F3EEE1" opacity=".5" text-anchor="middle">${n}</text></svg>`);
const demoActor = c => svgDataUri(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900">
  <circle cx="200" cy="105" r="66" fill="${DEMO_COLORS[c]}"/>
  <path d="M200 175 L330 430 L302 880 L98 880 L70 430 Z" fill="${DEMO_COLORS[c]}" opacity=".92"/></svg>`);
/* Il velo: una sagoma per ogni casella che la demo sostituisce — gli sfondi
   (le caselle vere, non `scena${i+1}`: da quando una scena puo' essere divisa
   in parti l'indice nell'elenco non e' piu' il nome dello sfondo), i ritagli
   neutri e ogni posa. Si costruisce solo al primo `d`, poi non cambia piu'. */
function createDemoLayer() {
  const layer = {};
  const silhouettes = Object.fromEntries(Object.keys(DEMO_COLORS).map(character => [character, demoActor(character)]));
  [...new Set(STORY.scene.map((_, i) => backgroundSlot(i)))]
    .forEach((slot, index) => layer[`${slot}.png`] = demoBackground(index + 1));
  Object.entries(silhouettes).forEach(([character, svg]) => layer[`attore_${character}.png`] = svg);
  const posedActors = new Map(STORY.scene.flatMap(scene => scene.cast || []).filter(actor => actor.posa)
    .map(actor => [`attore_${actor.c.toLowerCase()}_${actor.posa}.png`, actor.c.toLowerCase()]));
  posedActors.forEach((character, filename) => layer[filename] = silhouettes[character]);
  return layer;
}

function demo() {
  state.demo = !state.demo;
  render();
}

/* ---- voce dei personaggi ----
   Niente file audio: qualche bip sintetizzato al volo, come nei giochi a
   fumetti. Ogni personaggio ha la sua altezza - Mauro cupo, Rosalia acuta -
   e la battuta piu' lunga fa piu' bip. Il volume sta nella barra in alto a
   destra; "m" azzera e rimette. */
const VOICE = {
  //            altezza  onda        passo   nota  deriva  taglio  lettere/bip  volume
  Giuseppe:  { f: 242, onda: "triangle", passo: .094, nota: .105, deriva: -.10, taglio: 2200, den: 4, vol: .53 },
  Rosalia:   { f: 395, onda: "triangle", passo: .092, nota: .070, deriva:  .20, taglio: 4500, den: 3.4, vol: .48 },
  Roberto:   { f: 198, onda: "sawtooth", passo: .094, nota: .095, deriva:  .02, taglio: 1300, den: 4.5, vol: .28 },
  Augusto:   { f: 312, onda: "square",   passo: .076, nota: .075, deriva:  .07, taglio: 2600, den: 3, vol: .14 },
  Mauro:     { f: 183, onda: "square",   passo: .082, nota: .130, deriva:  .14, taglio: 4500, den: 6, vol: .07 }
};
/* Il volume e' una manopola, non un interruttore: 0 e' il silenzio, e `m`
   fa la spola fra zero e l'ultimo valore scelto. */
let audio = null, volume = .7, lastVolume = .7;

/* Chi parla adesso zittisce chi parlava prima. I bip di una battuta sono
   programmati tutti in anticipo, quindi non basta smettere di crearne: la
   battuta passa per una sua uscita, e chiuderla taglia anche quello che era
   gia' in coda. Gli oscillatori restano accesi fino alla loro fine, ma
   scollegati non si sentono. */
let voiceOutput = null;

function stopVoice() {
  if (!voiceOutput) return;
  voiceOutput.gain.cancelScheduledValues(audio.currentTime);
  voiceOutput.gain.setValueAtTime(0, audio.currentTime);
  voiceOutput.disconnect();
  voiceOutput = null;
}

function playVoice(c, testo) {
  stopVoice();                      // la battuta di prima finisce qui
  const v = VOICE[c];
  if (!v) return;              // senza profilo, nessuna voce
  const bip = BEEP_COUNT(v, testo);
  // un filtro solo per tutta la battuta: e' il taglio a dare il timbro,
  // e tiene a bada le onde piu' aspre senza abbassare il volume
  const filtro = audio.createBiquadFilter();
  filtro.type = "lowpass";
  filtro.frequency.value = v.taglio;
  filtro.Q.value = .7;
  voiceOutput = audio.createGain();
  filtro.connect(voiceOutput).connect(audio.destination);
  for (let i = 0; i < bip; i++) {
    const t = audio.currentTime + .01 + i * v.passo;
    const avanzamento = bip > 1 ? i / (bip - 1) : 0;      // la voce sale o cala lungo la frase
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = v.onda;
    o.frequency.setValueAtTime(v.f * (1 + v.deriva * avanzamento) * (.95 + Math.random() * .1), t);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(v.vol * volume, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + v.nota);
    o.connect(g).connect(filtro);
    if (i === bip - 1)
      o.addEventListener("ended", () => filtro.disconnect(), { once: true });
    o.start(t); o.stop(t + v.nota + .01);
  }
}

/* Il contesto nasce sospeso finche' non c'e' un gesto dell'utente, e resume()
   e' asincrono: programmare i bip prima che sia partito li manda nel vuoto.
   Per questo si aspetta il resume, e si sblocca al primo tocco o tasto. */
/* Restituisce il contesto acceso, o null se non c'e' niente da accendere.
   `poi` viene chiamata solo quando il contesto e' davvero partito. */
function withAudioContext(poi) {
  if (!volume || typeof AudioContext !== "function") return;
  audio = audio || new AudioContext();
  if (audio.state === "suspended") audio.resume().then(poi, () => {});
  else poi?.();
}

const speak = (c, testo) => withAudioContext(() => playVoice(c, testo));

/* ---- la battuta al ritmo della voce ----
   `suona()` programma i bip a intervalli di `passo`: il testo compare negli
   stessi istanti, un pezzo per bip. I pezzi si tagliano fra una parola e
   l'altra, che e' quanto di piu' vicino a una sillaba si possa fare senza un
   dizionario, e restano tutti in pagina fin dal primo istante — invisibili,
   non assenti — cosi' la riga non si allunga sotto gli occhi e `smoke.js`
   trova la battuta intera nel markup.
   Il ritmo non dipende dal volume: a zero il personaggio parla lo stesso, si
   vede soltanto. E' il tempo della battuta, non un ornamento del suono. */
const BEEP_COUNT = (v, testo) => Math.max(3, Math.min(16, Math.round(testo.length / v.den)));

function splitText(testo, n) {
  const parole = testo.split(/(\s+)/).filter(Boolean);
  if (parole.length <= n) return parole;
  const pezzi = [], quante = Math.ceil(parole.length / n);
  for (let i = 0; i < parole.length; i += quante) pezzi.push(parole.slice(i, i + quante).join(""));
  return pezzi;
}

let rhythmTimers = [];
function animateSpeech(nodo, c, testo) {
  rhythmTimers.forEach(clearTimeout);
  rhythmTimers = [];
  const v = VOICE[c];
  if (!nodo || !v) return;     // senza un profilo non c'e' un ritmo da seguire
  const pezzi = splitText(testo, BEEP_COUNT(v, testo));
  nodo.innerHTML = pezzi.map(p => `<span class="sillaba">${escapeHtml(p)}</span>`).join("");
  nodo.querySelectorAll(".sillaba").forEach((sp, i) =>
    rhythmTimers.push(setTimeout(() => sp.classList.add("detta"), i * v.passo * 1000)));
}
const unlockAudio = () => withAudioContext();
addEventListener("pointerdown", unlockAudio, { once: true, passive: true });
addEventListener("keydown", unlockAudio, { once: true });

/* L'icona dice il livello a colpo d'occhio; la prova si sente solo quando si
   lascia la barra, non a ogni scatto. */
function updateVolumeDisplay() {
  const i = document.getElementById("k-icona"), b = document.getElementById("k-vol");
  if (b) b.value = Math.round(volume * 100);
  if (i) i.textContent = !volume ? "🔇" : volume < .34 ? "🔈" : volume < .67 ? "🔉" : "🔊";
}

function setVolume(v, prova) {
  volume = Math.max(0, Math.min(1, v));
  if (!volume) stopVoice();                     // a zero tace anche chi sta parlando
  if (volume) lastVolume = volume;
  updateVolumeDisplay();
  if (prova && volume) speak("Giuseppe", "prova prova");
}

/* `m` resta l'interruttore: azzera, o rimette l'ultimo volume scelto. */
function toggleMute() { setVolume(volume ? 0 : lastVolume, true); }

/* ---- modalita' sviluppo ----
   Solo sul file locale, con "v": dice a che punto siamo, quali immagini non
   sono incorporate e permette di saltare a una schermata senza percorrerle
   tutte. Serve a provare una scena in mezzo senza rifare la strada. */
const SCREEN_NAMES = { cover: "Copertina", avviso: "Avviso", cast: "I personaggi", tavolo: "Tavolo degli indizi",
  narr: "Il detective", sol: "Il verdetto", fine: "Soluzione e congedo" };
const screenLabel = x => {
  if (x.t === "quiz") return "Scheda finale";
  if (x.t !== "scene") return SCREEN_NAMES[x.t] || x.t;
  return `Scena ${sceneNumber(STORY.scene[x.i], x.i)}`;
};

/* L'elenco del pannello non ripete le parti: una scena divisa in quattro pezzi
   e' una riga sola, che porta al primo. Per sapere se e' quella corrente serve
   sapere fin dove arriva, e `fino` lo dice. */
const SCREEN_GROUPS = SLIDES.reduce((righe, x, k) => {
  const ultima = righe[righe.length - 1];
  if (ultima && sameScene(SLIDES[ultima.va], x)) ultima.fino = k;
  else righe.push({ va: k, fino: k, testo: screenLabel(x) });
  return righe;
}, []);
const currentScreenGroup = () => SCREEN_GROUPS.findIndex(r => state.n >= r.va && state.n <= r.fino);
function jumpScreenGroup(verso) {
  const k = Math.max(0, Math.min(SCREEN_GROUPS.length - 1, currentScreenGroup() + verso));
  goTo(SCREEN_GROUPS[k].va);
}


/* I due pannelli d'autore si tengono per riferimento. Cercarli per classe
   costava un bug muto: il pannello di sviluppo portava anche `.regia-pan`, e
   `querySelector` rende il primo che trova, cosi' `render()` cancellava quello
   sbagliato a ogni battuta e `pannelloDev()` lo ricostruiva subito dopo. Con
   una variabile per pannello la classe torna a essere solo un fatto di stile. */
let directorPanel = null, developerPanel = null;
const closePanel = q => { q?.remove(); return null; };

function renderDeveloperPanel() {
  const s = SLIDES[state.n], sc = s.t === "scene" ? STORY.scene[s.i] : null;
  let p = developerPanel;
  if (!p) {
    p = developerPanel = document.body.appendChild(elementFromHtml(
      `<div class="pannello dev-pan carta">
         <div class="riga"><b>Sviluppo</b><span id="dev-dove"></span></div>
         <div class="salti" id="dev-salti"></div>
       </div>`, true));
    const salti = p.querySelector("#dev-salti");
    salti.innerHTML = SCREEN_GROUPS.map((r, k) =>
      `<button data-salta="${r.va}"><i>${k + 1}</i>${escapeHtml(r.testo)}</button>`).join("");
    /* i tasti restano al loro posto: cambia solo quale e' acceso */
    salti.onclick = e => {
      const b = e.target.closest("button");
      if (!b) return;
      goTo(+b.dataset.salta);
      stage.focus();                       // le frecce tornano a guidare la storia
    };
  }
  p.querySelectorAll("#dev-salti [data-salta]").forEach((b, k) => {
    const qui = state.n >= SCREEN_GROUPS[k].va && state.n <= SCREEN_GROUPS[k].fino;
    b.classList.toggle("qui", qui);
    if (qui) b.scrollIntoView({ block: "nearest" });
  });
  p.querySelector("#dev-dove").textContent =
    `${state.n + 1}/${SLIDES.length} · ${s.t}`
    + (sc ? ` · ${sceneSlot(s.i)} · scena ${sceneNumber(sc, s.i)}${sc.parte ? " " + sc.parte : ""}`
          + ` · battuta ${state.step}/${sc.battute.length}` : "")
    + ` · voce ${Math.round(volume * 100)}%${state.demo ? " · sagome di prova" : ""}`;
  return p;
}

/* Scoprire una scena battuta per battuta serve al tavolo, non a chi prova:
   questo la mostra tutta in un colpo. */
function toggleDevelopment() {
  if (!DEV_ENABLED) return;
  state.developmentMode = !state.developmentMode;
  if (state.developmentMode) renderDeveloperPanel();
  else developerPanel = closePanel(developerPanel);
}

/* ---- modalita' regia ----
   Si accende con "r" su una scena: personaggi e oggetti diventano trascinabili,
   la rotella (o i tasti + e -) li ridimensiona, e il pannello mostra le righe
   da incollare in STORY. Serve a decidere la regia con l'occhio invece che a
   forza di numeri indovinati. */
let selection = null;

const roundOne = n => Math.round(n * 10) / 10;
const zIndexField = d => d.z === undefined ? "" : `,z:${d.z}`;
const castSource = sc => "cast:[" + (sc.cast || []).map(a =>
  `{c:"${a.c}"${a.posa ? `,posa:"${a.posa}"` : ""},x:${roundOne(a.x)},b:${roundOne(a.b)},h:${roundOne(a.h)}${zIndexField(a)}}`).join(",") + "],";
const backgroundSource = sc => sc.sfondo
  ? `sfondo:{scala:${roundOne(sc.sfondo.scala)}, fx:${roundOne(sc.sfondo.fx)}, fy:${roundOne(sc.sfondo.fy)}},`
  : "";
const foregroundSource = sc => (sc.primo || []).length
  ? "primo:[" + sc.primo.map(o => `{lato:"${o.lato}",x:${roundOne(o.x)},b:${roundOne(o.b)},h:${roundOne(o.h)}${zIndexField(o)}}`).join(",") + "],"
  : "";

function renderDirectorPanel(i) {
  const sc = STORY.scene[i];
  const p = directorPanel || (directorPanel = document.body.appendChild(elementFromHtml(
    `<div class="pannello regia-pan carta">
       <div class="riga"><b>Regia scena ${i + 1}</b>
         <span>trascina per spostare · rotella o <kbd>+</kbd><kbd>-</kbd> per la taglia ·
         frecce per lo scatto fine · lo <b>sfondo</b> si prende toccando fuori dalle figure ·
         <kbd>r</kbd> per uscire</span></div>
       <div class="riga" id="regia-sel">niente selezionato</div>
       <div class="riga"><span class="occhiello">profondità</span>
         <button class="btn" data-prof="-1">← indietro</button>
         <button class="btn" data-prof="1">avanti →</button>
         <span>oppure <kbd>[</kbd> <kbd>]</kbd></span></div>
       <textarea readonly spellcheck="false"></textarea>
       <div class="riga"><button class="btn" id="regia-copia">Copia</button>
         <span id="regia-eco"></span></div>
     </div>`, true)));
  p.querySelector("textarea").value = [backgroundSource(sc), castSource(sc), foregroundSource(sc)].filter(Boolean).join("\n");
  p.querySelector("#regia-sel").textContent = !selection ? "niente selezionato"
    : selection.sfondo
      ? `sfondo — ingrandimento ${roundOne(selection.dato.scala)}× · fuoco ${roundOne(selection.dato.fx)}% ${roundOne(selection.dato.fy)}%`
      : `${selection.nome} — x ${roundOne(selection.dato.x)} · b ${roundOne(selection.dato.b)} · h ${roundOne(selection.dato.h)}`;
  p.querySelectorAll("[data-prof]").forEach(b =>
    b.onclick = () => { if (selection) changeDepth(+b.dataset.prof); });
  p.querySelector("#regia-copia").onclick = () => {
    const t = p.querySelector("textarea");
    navigator.clipboard?.writeText(t.value).then(
      () => p.querySelector("#regia-eco").textContent = "copiato",
      () => { t.select(); p.querySelector("#regia-eco").textContent = "selezionato: copia a mano"; });
  };
  return p;
}

/* Lo sfondo si regola come un attore: trascinare sposta la porzione inquadrata,
   la rotella cambia l'ingrandimento. Il fuoco e' il punto che resta fermo:
   fx 0 mostra la parte sinistra, 100 la destra. */
function positionBackground(elementFromHtml, d) {
  elementFromHtml.style.transform = `scale(${d.scala})`;
  elementFromHtml.style.transformOrigin = `${d.fx}% ${d.fy}%`;
}

function positionElement(elementFromHtml, d) {
  elementFromHtml.style.left = d.x + "%"; elementFromHtml.style.bottom = d.b + "%"; elementFromHtml.style.height = d.h + "%";
}

function activateDirector(i) {
  const pal = stage.querySelector(".palco");
  if (!pal) return;
  pal.classList.add("regia");
  const sc = STORY.scene[i];
  const voci = [...(sc.cast || []), ...(sc.primo || [])];
  const nodi = [...pal.querySelectorAll(".attore, .primo")];

  const gia = voci.indexOf(selection?.dato);
  if (gia >= 0) { nodi[gia].classList.add("sel"); selection = { nodo: nodi[gia], dato: voci[gia], nome: selection.nome }; }

  nodi.forEach((n, k) => {
    const dato = voci[k], nome = dato.c || `oggetto ${dato.lato.toUpperCase()}`;
    n.addEventListener("pointerdown", e => {
      e.preventDefault();
      nodi.forEach(o => o.classList.remove("sel"));
      n.classList.add("sel");
      const r = pal.getBoundingClientRect();
      selection = { nodo: n, dato, nome };
      const x0 = dato.x, b0 = dato.b, px = e.clientX, py = e.clientY;
      n.setPointerCapture(e.pointerId);
      const muovi = ev => {
        dato.x = x0 + (ev.clientX - px) / r.width * 100;
        dato.b = b0 - (ev.clientY - py) / r.height * 100;
        positionElement(n, dato); renderDirectorPanel(i);
      };
      const molla = () => { n.removeEventListener("pointermove", muovi); };
      n.addEventListener("pointermove", muovi);
      n.addEventListener("pointerup", molla, { once: true });
      n.addEventListener("pointercancel", molla, { once: true });
      renderDirectorPanel(i);
    });
  });

  // lo sfondo: si seleziona toccando fuori dalle figure
  const fondo = pal.querySelector(".sfondo");
  if (fondo) {
    fondo.style.pointerEvents = "auto";
    fondo.style.cursor = "grab";
    fondo.style.touchAction = "none";
    fondo.addEventListener("pointerdown", e => {
      e.preventDefault();
      nodi.forEach(o => o.classList.remove("sel"));
      const sc2 = STORY.scene[i];
      sc2.sfondo = sc2.sfondo || { scala: 1, fx: 50, fy: 50 };
      selection = { nodo: fondo, dato: sc2.sfondo, nome: "sfondo", sfondo: true };
      const r = pal.getBoundingClientRect();
      const x0 = sc2.sfondo.fx, y0 = sc2.sfondo.fy, px = e.clientX, py = e.clientY;
      fondo.setPointerCapture(e.pointerId);
      const muovi = ev => {
        const k = Math.max(1.01, sc2.sfondo.scala) - 1;
        selection.dato.fx = Math.max(0, Math.min(100, x0 - (ev.clientX - px) * 100 / (r.width * k)));
        selection.dato.fy = Math.max(0, Math.min(100, y0 - (ev.clientY - py) * 100 / (r.height * k)));
        positionBackground(fondo, selection.dato); renderDirectorPanel(i);
      };
      const molla = () => fondo.removeEventListener("pointermove", muovi);
      fondo.addEventListener("pointermove", muovi);
      fondo.addEventListener("pointerup", molla, { once: true });
      fondo.addEventListener("pointercancel", molla, { once: true });
      renderDirectorPanel(i);
    });
  }

  pal.addEventListener("wheel", e => {
    if (!selection) return;
    e.preventDefault();
    if (selection.sfondo) {
      selection.dato.scala = Math.max(1, Math.min(4, selection.dato.scala + (e.deltaY < 0 ? .05 : -.05)));
      positionBackground(selection.nodo, selection.dato);
    } else {
      selection.dato.h = Math.max(2, selection.dato.h + (e.deltaY < 0 ? 1 : -1));
      positionElement(selection.nodo, selection.dato);
    }
    renderDirectorPanel(i);
  }, { passive: false });

  renderDirectorPanel(i);
}

/* La sovrapposizione segue l'ordine dell'elenco: chi viene dopo sta davanti.
   Questi due comandi scambiano di posto e quindi cambiano la profondita'. */
/* Dentro il proprio elenco si scambia di posto. Arrivati in fondo si scavalca
   l'altro piano: gli oggetti in primo piano stanno davanti a tutti finche' un
   attore non chiede di passargli davanti (z 6), o l'oggetto di finire dietro
   (z 0). Senza z valgono i piani di partenza: attori 1, oggetti 5. */
function changeDepth(verso) {
  if (selection.sfondo) return;                 // lo sfondo sta sotto a tutti, per definizione
  const sc = STORY.scene[SLIDES[state.n].i];
  const attore = (sc.cast || []).includes(selection.dato);
  const arr = attore ? sc.cast : (sc.primo || []);
  const k = arr.indexOf(selection.dato), j = k + verso;
  if (k < 0) return;
  if (j >= 0 && j < arr.length) [arr[k], arr[j]] = [arr[j], arr[k]];
  else if (attore ? verso > 0 : verso < 0) selection.dato.z = attore ? 6 : 0;
  else delete selection.dato.z;
  render();
}

function moveSelection(dx, db, grosso) {
  if (selection.sfondo) {                       // sullo sfondo le frecce spostano il fuoco
    const p = grosso ? 4 : 1;
    selection.dato.fx = Math.max(0, Math.min(100, selection.dato.fx - dx * p));
    selection.dato.fy = Math.max(0, Math.min(100, selection.dato.fy + db * p));
    positionBackground(selection.nodo, selection.dato); renderDirectorPanel(SLIDES[state.n].i);
    return;
  }
  const p = grosso ? 2 : .5;
  selection.dato.x += dx * p; selection.dato.b += db * p;
  positionElement(selection.nodo, selection.dato); renderDirectorPanel(SLIDES[state.n].i);
}

function toggleDirector() {
  const s = SLIDES[state.n];
  if (!DIRECTOR_ENABLED || s.t !== "scene") return;
  state.directorMode = !state.directorMode;
  selection = null;
  directorPanel = closePanel(directorPanel);
  render();
}

/* ---- interazione ----
   Una regola sola per tutti i tasti: quelli disegnati dentro #stage portano un
   `data-*` e li serve il gestore qui sotto, perche' il markup dello stage viene
   riscritto a ogni render e un ascoltatore attaccato addosso morirebbe con lui.
   Quelli che vivono fuori - il pulsante per proseguire, i pannelli d'autore, il
   "?" e il volume - sopravvivono al render e quindi portano il proprio gestore. */

/* Aprire un indizio e' la scelta, non la lettura: da quel momento una delle due
   domande e' spesa. Ci si passa da qui sia col clic sia coi tasti 1-4. */
function openClue(i) {
  /* La porta unica controlla anche di essere una porta: fuori dal tavolo
     aprire una scheda spenderebbe una domanda per una schermata che non la
     mostra. Oggi non ci si arriva, ma il giorno che qualcuno lega la funzione
     a una scorciatoia nuova, il costo sarebbe muto. */
  if (SLIDES[state.n].t !== "tavolo") return;
  const { scelti } = state.indagine;
  if (!scelti.includes(i)) {
    if (scelti.length >= MAX_CLUES) return;      // domande finite: la scheda non si apre
    scelti.push(i);
  }
  state.clue = i;
  render();
}

stage.addEventListener("click", e => {
  const t = e.target.closest("[data-clue],[data-chiedi],[data-avanti],[data-opt]");
  if (t) {
    if (t.dataset.clue !== undefined) {
      if (t.dataset.clue === "close") { state.clue = null; return render(); }
      return openClue(+t.dataset.clue);
    }
    if (t.dataset.avanti !== undefined) return confirmAndAdvance();
    if (t.dataset.chiedi !== undefined) {
      const chi = t.dataset.chiedi, gia = askedPeople(state.clue);
      if (!gia.includes(chi) && gia.length < MAX_PEOPLE)
        state.indagine.chiesto[state.clue] = [...gia, chi];
      return render();
    }
    if (t.dataset.opt !== undefined) { state.risposte[currentQuestion()] = +t.dataset.opt; return render(); }
    return;
  }
  /* Via la barra, lo schermo e' il telecomando: un tocco manda avanti, e basta.
     La storia non torna indietro: una battuta scoperta resta scoperta, e chi
     ascolta non vede mai riavvolgere. Non dove una schermata chiede una scelta:
     li' un tocco distratto costerebbe una domanda dell'indagine o una risposta
     del quiz, e si prosegue solo col pulsante. In regia si trascina, quindi un
     trascinamento non e' un clic. */
  if (state.directorMode || NO_STAGE_CLICK.has(SLIDES[state.n].t)) return;
  reveal();
});

/* ---- finestra dei comandi ---- */

function renderHelp() {
  const k = [
    ["clic", "scopre la battuta successiva"],
    ["spazio / → / ↓", "scopre la battuta successiva"],
    ["← / ↑", "niente: la storia non torna indietro"],
    ["pulsante in basso", "l’unico modo di cambiare schermata"],
    ["1–4", "apre l’indizio in quella posizione sul tavolo"],
    ["d", "sagome colorate al posto delle illustrazioni"],
    ...(DIRECTOR_ENABLED ? [
      ["r", "regia: sposta e ridimensiona personaggi e oggetti"],
      ["[  ]", "in regia: porta chi è selezionato in secondo o in primo piano"]] : []),
    ...(DEV_ENABLED ? [
      ["v", "sviluppo: stato, immagini mancanti, salto a una schermata"],
      ["↑ ↓", "col pannello sviluppo aperto: salta fra le righe dell’elenco"],
      ["← →", "col pannello sviluppo aperto: percorre la storia battuta per battuta"]] : []),
    ["m", "azzera il volume delle voci, o rimette l’ultimo"],
    ["f", "schermo intero"],
    ["esc", "chiude questa finestra"]
  ].map(([a, b]) => `<div><kbd>${escapeHtml(a)}</kbd><span>${escapeHtml(b)}</span></div>`).join("");
  overlayElement.innerHTML = `<div class="ov">
    <div class="ov-head"><h2 class="titolo">Comandi</h2><span class="spacer"></span>
      <button class="btn" data-close>Chiudi (esc)</button></div>
    <div class="keys">${k}</div>
    <p style="color:var(--muted);max-width:62ch">Le battute compaiono una alla volta: chi gioca non legge mai prima di te.</p>
  </div>`;
}

/* Una sola finestra sopra la scena, riempita di volta in volta: i comandi, o
   una domanda a cui rispondere prima di proseguire. */
function showOverlay(html, screenLabel) {
  state.overlay = true;
  overlayElement.innerHTML = html;
  overlayElement.scrollTop = 0;
  overlayElement.hidden = false;
  overlayElement.setAttribute("role", "dialog");
  overlayElement.setAttribute("aria-modal", "true");
  overlayElement.setAttribute("aria-label", screenLabel);
  overlayElement.querySelector("[data-close],#ov-no")?.focus();
}

function openHelp() { renderHelp(); showOverlay(overlayElement.innerHTML, "Comandi dell’investigatore"); }

/* Chiede conferma prima di un passo che non si puo' disfare. Il "no" e' il
   tasto che prende il fuoco: chi tira dritto deve volerlo. */
/* Ogni conferma si apre con l'investigatore che riflette: e' lui che sta
   chiedendo, e la figura lo dice prima delle parole. `indietro` nomina la via
   d'uscita, perche' non e' la stessa in tutte le domande. */
function confirmAction(domanda, spiega, avanza, poi, indietro = "Torna indietro", poiIndietro = null) {
  showOverlay(`<div class="ov conferma">
      ${detectiveFigure("detective_riflessione.png", "L’investigatore riflette")}
      <h2>${escapeHtml(domanda)}</h2>
      ${spiega ? `<p class="nota">${escapeHtml(spiega)}</p>` : ""}
      <div class="azioni">
        <button class="btn"${poiIndietro ? ` id="ov-no"` : " data-close"}>${escapeHtml(indietro)}</button>
        <button class="btn primaria" id="ov-si">${escapeHtml(avanza)}</button>
      </div>
    </div>`, domanda);
  setupImageSlots(overlayElement);
  overlayElement.querySelector("#ov-si").onclick = () => { closeOverlay(); poi(); };
  const no = overlayElement.querySelector("#ov-no");
  if (no) no.onclick = poiIndietro;   // non chiude: apre la domanda seguente
}
function closeOverlay() { state.overlay = false; overlayElement.hidden = true; stage.focus(); }
overlayElement.addEventListener("click", e => { if (e.target === overlayElement || e.target.closest("[data-close]")) closeOverlay(); });
document.getElementById("k-vol").oninput = e => setVolume(e.target.value / 100, false);
document.getElementById("k-vol").onchange = e => setVolume(e.target.value / 100, true);
updateVolumeDisplay();

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "Escape") { if (state.overlay) closeOverlay(); return; }
  if (state.overlay) return;
  switch (e.key) {
    /* Due gesti soli, e ognuno ha due tasti: avanti e' spazio, destra o giu';
       indietro e' sinistra o su, e nella storia non fa niente perche' indietro
       non si torna. In regia le frecce spostano la figura scelta, e col pannello
       di sviluppo aperto le verticali sfogliano le schermate: sono i due mestieri
       d'autore, e vengono prima. */
    case " ": case "ArrowRight": case "ArrowDown": case "PageDown":
      e.preventDefault();
      if (state.directorMode && selection && e.key === "ArrowRight") moveSelection(1, 0, e.shiftKey);
      else if (state.directorMode && selection && e.key === "ArrowDown") moveSelection(0, -1, e.shiftKey);
      /* in regia la storia non si muove, come per il clic: senza niente di
         selezionato lo spazio scopriva una battuta e cambiava chi e' in luce
         proprio mentre si sistemano le figure */
      else if (state.directorMode) break;
      /* col pannello aperto le verticali sfogliano l'elenco e le orizzontali
         percorrono la storia fino in fondo, cambiando pagina a fine scena:
         si prova tutto senza staccare la mano dalle frecce */
      else if (state.developmentMode && e.key === "ArrowDown") jumpScreenGroup(1);
      else if (state.developmentMode && e.key === "ArrowRight") advance();
      else reveal();                  // la tastiera scopre: la pagina la cambia il pulsante
      break;
    case "ArrowLeft": case "ArrowUp": case "PageUp":
      e.preventDefault();
      if (state.directorMode && selection && e.key === "ArrowLeft") moveSelection(-1, 0, e.shiftKey);
      else if (state.directorMode && selection && e.key === "ArrowUp") moveSelection(0, 1, e.shiftKey);
      else if (state.directorMode) break;
      else if (state.developmentMode && e.key === "ArrowUp") jumpScreenGroup(-1);
      else if (state.developmentMode) goTo(state.n - 1);   // sinistra: indietro e' d'autore
      else if (SLIDES[state.n].t === "cast") scrollCard(-1);   // le schede si risfogliano: non e' la storia
      break;
    case "d": case "D": demo(); break;
    case "r": case "R": toggleDirector(); break;
    case "v": case "V": toggleDevelopment(); break;
    case "m": case "M": toggleMute(); break;
    case "[": case "]":
      if (state.directorMode && selection) { e.preventDefault(); changeDepth(e.key === "]" ? 1 : -1); }
      break;
    case "+": case "=": case "-": case "_":
      if (state.directorMode && selection) {
        selection.dato.h = Math.max(2, selection.dato.h + (e.key === "+" || e.key === "=" ? 1 : -1));
        positionElement(selection.nodo, selection.dato); renderDirectorPanel(SLIDES[state.n].i);
      }
      break;
    case "?": openHelp(); break;
    case "f": case "F":
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.().catch(() => {});
      break;
    default:
      if (/^[1-4]$/.test(e.key)) openClue(+e.key - 1);   // fuori dal tavolo si ferma da sola
  }
});

render();
</script>
</body>
</html>
