<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L’oliva blu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..600&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500&display=swap">

<style>
/* ==================================================================
   Foglio di stile, in quest'ordine:
   gettoni · fondamenta · chrome · ricette · palcoscenico · schermate
   (scena, copertina, personaggi, indizi, quiz, soluzione, congedo) ·
   immagini e palco · strumenti d'autore · adattamenti
   Le "ricette" sono le classi da riusare: .carta, .sollevabile,
   .centrata, .ph-cifra. Prima di scrivere un riquadro nuovo, guarda li'.
   ================================================================== */

/* ---- gettoni ---- */
:root{
  --bg:#F3EEE1; --surface:#FBF8F0; --surface-2:#EDE6D4;
  /* Sul chiaro questi due non arrivavano a 4.5:1 — il grigio-oliva stava a 4.29
     e l'oro a 3.49. Scuriti quanto basta e non un grammo di piu'. */
  --ink:#23281A; --muted:#676F55; --line:#DBD2BD;
  --olive:#5E7233; --gold:#966107; --blu:#1F3FC4;
  --plum:#96496D; --teal:#3F7565; --rust:#A64B2A; --vino:#8E2B3E;
  --shadow:0 1px 2px rgba(35,40,26,.06),0 8px 28px rgba(35,40,26,.08);
  /* i tre caratteri, scritti una volta sola: titoli, testo, dati */
  /* I sei gradini della scala tipografica. Prima ogni regola decideva un
     corpo per conto suo: tredici misure sullo schermo, quattro delle quali
     stavano dentro due pixel l'una dall'altra. Da telefono la query rialza
     i gradini, non i selettori. */
  --t-titolo:clamp(2.6rem,8vw,5.5rem);      /* copertina · Fine */
  /* stesso motivo: sotto gli 800px la cifra scendeva sotto il nome */
  --t-nome:clamp(1.6rem,6.5vw,2.375rem);    /* nomi dei personaggi · domande */
  /* il minimo e' il corpo, non meno: sotto i 1240px il termine fluido scendeva
     a 19.8 e la voce finiva sotto la battuta — i gradini si incrociavano */
  --t-voce:clamp(1.375rem,2.2vw,1.7rem);    /* investigatore · titoli di scena */
  --t-corpo:clamp(18px,2.6vw + .55rem,22px);/* battute · indizi · pulsanti */
  --t-etichetta:.875rem;                    /* occhielli */
  /* la sezione indizi ha il corpo comune; da telefono la query lo rialza */
  --indizi:var(--t-corpo);
  --serif:"Bodoni Moda","Didot","Times New Roman",serif;
  --sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
:root:not([data-theme="light"]){ color-scheme:light dark; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12160F; --surface:#1B2016; --surface-2:#232A1D;
    --ink:#EDE7D6; --muted:#98A182; --line:#333C29;
    --olive:#9CB65C; --gold:#DFA93C; --blu:#7B96FF;
    --plum:#DA8FB2; --teal:#78BFAA; --rust:#E8957A; --vino:#E98C9E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#12160F; --surface:#1B2016; --surface-2:#232A1D;
  --ink:#EDE7D6; --muted:#98A182; --line:#333C29;
  --olive:#9CB65C; --gold:#DFA93C; --blu:#7B96FF;
  --plum:#DA8FB2; --teal:#78BFAA; --rust:#E8957A; --vino:#E98C9E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 34px rgba(0,0,0,.45);
}

/* ---- fondamenta ---- */
/* mai una parola spezzata: il testo giustificato allarga gli spazi, e va bene cosi' */
*{box-sizing:border-box; hyphens:none; -webkit-hyphens:none}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans);
  font-size:var(--t-corpo); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:3px; border-radius:4px}

#app{height:100vh; height:100dvh; display:grid; grid-template-rows:minmax(0,1fr); grid-template-columns:minmax(0,1fr)}

/* ---- chrome ---- */
/* Il volume galleggia sopra la scena: discreto finche' non lo si cerca. Era
   una pastiglia tonda col simbolo dentro, e nessuno capiva che fosse un
   pulsante: niente cerchio, altoparlante grande e una barra accanto.
   La finestra dei comandi non ha un tasto suo: si apre col "?". */
.volume{position:fixed; top:.7rem; right:.9rem; z-index:6; display:flex; align-items:center;
  gap:.55rem; opacity:.5; transition:opacity .2s}
.volume:hover,.volume:focus-within{opacity:1}
.volume .icona{font-size:2rem; line-height:1; cursor:default; user-select:none}
.volume input{width:8rem; accent-color:var(--olive); cursor:pointer}
.spacer{flex:1}
.btn{border:1px solid var(--line); border-radius:999px; padding:.44rem 1.17rem; font-size:var(--t-corpo);
  background:var(--surface-2); transition:border-color .15s, color .15s}
.btn:hover{border-color:var(--olive); color:var(--olive)}
.btn.primaria{background:var(--olive); border-color:var(--olive); color:var(--bg); font-weight:700}
.btn.primaria:hover{color:var(--bg); filter:brightness(1.1)}
/* Il pulsante per cambiare schermata sta nel flusso, allineato a destra: in
   fondo ai dialoghi nelle scene, in fondo al foglio altrove. Niente animazione
   d'entrata — il fotogramma finale di `rise` fissa opacity:1 e batterebbe lo
   spento di [disabled]. */
.azioni{display:flex; justify-content:flex-end}
.avanza{box-shadow:var(--shadow)}
/* Nella scena sta in cima alla colonna, sopra la battuta appena scoperta: e'
   li' che guarda l'investigatore, ed e' li' che deve trovarlo quando la scena
   finisce. Fuori dallo scorrimento: resta fermo mentre le battute scorrono. */
.azioni-scena{flex:none; display:flex; justify-content:flex-end}
.btn[disabled]{opacity:.35; cursor:not-allowed}
kbd{font:inherit; font-size:.78em; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px;
  padding:.05em .38em; color:var(--muted); background:var(--bg)}

/* ---- ricette ----
   Tre forme che tornano in mezza applicazione. Chi ne ha bisogno se le prende
   come classi, invece di riscriverne le dichiarazioni: un riquadro di carta,
   qualcosa che si solleva al passaggio, una schermata centrata a tutta altezza. */
.carta{background:var(--surface); border:1px solid var(--line); border-radius:2px; box-shadow:var(--shadow)}
.sollevabile{transition:transform .18s, border-color .18s}
.sollevabile:hover:not([disabled]){border-color:var(--gold); transform:translateY(-3px)}
.centrata{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center}
/* il ripiego tipografico di un'immagine che manca: una lettera o una cifra sola */
.ph-cifra{display:none; place-items:center; aspect-ratio:1; font-family:var(--serif);
  color:var(--speaker,var(--line)); border:1px solid var(--line); border-radius:2px; background:var(--surface)}
.slot.empty .ph-cifra{display:grid}

/* ---- palcoscenico: la cornice comune a ogni schermata ---- */
#stage{padding:clamp(1rem,3vh,2.4rem) clamp(1rem,4vw,3rem); display:flex; justify-content:center;
  overflow-y:auto; min-height:0; scrollbar-width:thin}
.sheet{width:100%; max-width:74rem; margin-block:auto; display:flex; flex-direction:column; gap:clamp(1rem,2.4vh,1.75rem)}
.eyebrow{font-size:var(--t-etichetta); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:500}
/* solo il titolo: il numerone e l'occhiello «Scena N di M · parte» se ne sono
   andati il 3 settembre 2026, e l'altezza che occupavano e' passata al palco */
.scene-head{display:flex; align-items:baseline}
/* il titolo di una schermata, non solo di una scena: lo usano la scena, il
   tavolo degli indizi e la finestra dei comandi */
.titolo{font-size:var(--t-voce)}

/* ---- la tavola illustrata, e il suo ripiego ---- */
.plate{border-style:dashed; padding:clamp(1rem,2.5vw,1.9rem); position:relative}
.plate.scena:not(.empty){border:none; background:var(--bg); box-shadow:none; padding:0;
  height:100%; display:flex; justify-content:center}

/* La schermata di scena e' divisa in due: sopra il titolo con l'immagine, fermi;
   sotto i dialoghi, che scorrono per conto loro. */
#stage:has(.scena-doppia){overflow:hidden; padding:clamp(.6rem,1.6vh,1.2rem) clamp(1rem,4vw,3rem) 0}
.sheet.scena-doppia{height:100%; margin-block:0; display:grid;
  grid-template-rows:minmax(0,54%) minmax(0,46%); gap:0}
/* Su schermo grande la scena si prende piu' spazio: il palco e' il quadrato
   piu' grande che entra nella riga di sopra, quindi alzare la riga e' l'unico
   modo di ingrandirlo. Sul telefono no: li' le battute hanno bisogno di tutta
   l'altezza che resta. */
@media (min-width:701px){ .sheet.scena-doppia{grid-template-rows:minmax(0,64%) minmax(0,36%)} }
.scena-doppia .alto{display:flex; flex-direction:column; gap:clamp(.4rem,1.4vh,1rem);
  min-height:0; overflow:hidden;
  padding-bottom:clamp(.6rem,1.8vh,1.1rem)}   /* niente filetto: a dividere basta lo stacco */
/* Il palco prende l'altezza che avanza sotto il titolo: legarlo a vh lo faceva
   uscire dalla sua meta' sui telefoni, dove finiva tagliato e sembrava ingrandito. */
.palco-box{flex:1 1 auto; min-height:0; display:flex; justify-content:center}
.scena-doppia .basso{display:grid; grid-template-columns:32% 1fr; min-height:0; overflow:hidden;
  padding-top:clamp(.9rem,2.4vh,1.6rem)}
/* la figura intera, non il ritratto: si appoggia in basso come sul palco */
.parlante{padding-right:clamp(.6rem,1.6vw,1.2rem); min-width:0; height:100%; min-height:0;
  overflow:hidden; display:flex; align-items:flex-start; justify-content:center;
  -webkit-mask-image:linear-gradient(to bottom,#000 76%,transparent 99%);
  mask-image:linear-gradient(to bottom,#000 76%,transparent 99%)}
/* Mezzo busto, dalla testa alla vita, e alla stessa scala per tutti: la figura
   e' alta un multiplo del riquadro, ancorata in alto, e quello che esce ai lati
   viene tagliato. La scala e' sull'**altezza** apposta. Un riquadro 3:4 con
   `object-fit:cover` la prendeva dalla larghezza — e siccome ogni ritaglio e'
   piu' stretto di 3:4, l'ingrandimento finiva per dipendere dall'apertura delle
   braccia: `roberto_accoglienza` (642x900) restava figura intera dove
   `mauro_guardingo` (229x900) era gia' mezzo busto. La sfumatura sul fondo sta
   sul contenitore, non sull'immagine, o cadrebbe fuori campo. */
/* Sul telefono la colonna e' stretta e il 265% ingrandiva la figura fino a
   lasciare fuori la faccia di chi non ha la testa al centro del ritaglio
   (Andrea, 24 ottobre 2026): l'altezza ha anche un tetto legato alla
   larghezza della colonna. Sugli schermi larghi vince ancora il 265%. */
.parlante{container-type:size}
.parlante .figura-parlante{display:block; height:min(265%, 350cqw); width:auto; max-width:none;
  animation:entra .35s ease-out both}
.parlante .ph.sigla{width:100%; font-size:clamp(2rem,6vw,3.4rem); opacity:.55}
@keyframes entra{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}
.dialoghi{min-height:0; display:flex; flex-direction:column;
  gap:clamp(.8rem,2vh,1.4rem)}
.plate.scena:not(.empty)::before{display:none}
.plate::before{content:""; position:absolute; inset:6px; border:1px solid var(--line); border-radius:1px; pointer-events:none; opacity:.6}
.plate > img{display:block; width:100%; height:auto; border-radius:1px}
.plate .brief{font-family:var(--mono); font-size:var(--t-etichetta); line-height:1.65; color:var(--muted); margin:0; max-width:70ch; text-align:left}
.plate .brief-label{display:flex; align-items:center; gap:.55rem; margin-bottom:.7rem}
.plate .brief-label span{font-size:var(--t-etichetta); letter-spacing:.16em; text-transform:uppercase; color:var(--olive)}
.leaf{width:14px; height:14px; flex:none; color:var(--olive)}

/* ---- schermata di scena: i dialoghi ---- */
/* Scorre la colonna delle battute, non i dialoghi interi: la barra deve
   fermarsi sotto il pulsante, che sta fermo in cima. */
.bubbles{overflow-y:auto; min-height:0; scrollbar-width:thin;
  padding-bottom:clamp(1rem,3vh,2rem);
  display:flex; flex-direction:column; gap:.85rem}
.bubble{display:flex; gap:.9rem; align-items:flex-start; opacity:.4; transition:opacity .4s ease}
.bubbles .bubble:first-child{opacity:1; animation:rise .32s ease-out both}
/* il testo compare a ritmo: i pezzi ci sono gia' tutti, ma si vedono uno alla
   volta, cosi' la riga non cresce sotto gli occhi mentre si legge */
.sillaba{opacity:0}
.sillaba.detta{opacity:1; transition:opacity .12s linear}
/* il passaggio da una parte all'altra della stessa scena: una riga, non un taglio */
.bubbles hr.atto{width:100%; border:none; border-top:1px solid var(--line); margin:.15rem 0}
@keyframes rise{from{opacity:0; transform:translateY(-10px)}to{opacity:1; transform:none}}
.who{flex:none; width:clamp(6rem,11vw,10rem); text-align:right; font-weight:700; font-size:var(--t-corpo);
  letter-spacing:.01em; color:var(--speaker,var(--muted)); padding-top:.18em}
/* L'inciso era l'unica misura che nasceva dal `small` del browser — 0.75em di
   0.9em, fuori da ogni scala e, sul telefono, sotto il minimo di tutto il
   resto. Ora prende esattamente il corpo del nome che sta sopra: a separarli
   restano il corsivo, il peso e il colore, che e' come si separa tutto il
   resto qui dentro. */
.who small{display:block; font-size:1em; font-weight:400; font-style:italic;
  color:var(--muted); letter-spacing:0}
.said{flex:1; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--speaker,var(--line));
  border-radius:2px 10px 10px 2px; padding:.6rem .95rem; box-shadow:var(--shadow)}
.said p{margin:0}
.said p + p{margin-top:.5rem}
[data-c="Giuseppe"]{--speaker:var(--gold)}
[data-c="Rosalia"]{--speaker:var(--plum)}
[data-c="Roberto"]{--speaker:var(--olive)}
[data-c="Augusto"]{--speaker:var(--teal)}
[data-c="Mauro"]{--speaker:var(--blu)}
[data-c="Elisa"]{--speaker:var(--rust)}
[data-c="Andrea"]{--speaker:var(--vino)}

/* ---- le schermate dell'investigatore: la voce, sola in mezzo allo schermo ---- */
.narr-fine{gap:.9rem; text-align:center}
/* l'investigatore sopra, il testo in mezzo, il pulsante sotto: una colonna a
   ogni larghezza. Di fianco ci stava per far entrare sei righe grandi, ma
   lasciava il pulsante sospeso a meta' altezza, lontano dal testo. */
.narr-fine{flex-direction:column; align-items:center}
.narr-fine .azioni{width:100%; justify-content:center}
/* l'investigatore in cima alla colonna: lo condividono avviso, riepilogo e
   ultima schermata, quindi la regola non sta piu' sotto una sola di loro */
.guida{display:flex; justify-content:center}
.guida img{display:block; width:auto; height:auto; max-width:min(100%,26rem); max-height:38vh}
/* Il riepilogo al doppio come le altre tre: il testo e' poco e
   la figura porta meta' del messaggio. */
.narr-fine:not(.avviso):not(.verdetto):not(.fine-caso) .guida img{
  max-height:76vh; max-width:min(100%,52rem)}
.guida .ph{width:8rem; font-size:3rem; opacity:.4}
.narr-fine .detto{display:flex; flex-direction:column; gap:.9rem}
.narr-fine p{margin:0; max-width:34ch; font-size:clamp(1.3rem,3.2vw,2.2rem); line-height:1.35}
/* l'investigatore al doppio: su queste quattro schermate il testo e' poco e
   la figura e' meta' del messaggio */
.avviso .guida img{max-height:72vh; max-width:min(100%,44rem)}
/* le quattro schermate dell'investigatore parlano col testo pieno, non col
   grigio di servizio: e' lui che racconta, non una nota a margine */
.avviso .detto p, .avviso .detto p:last-child{font-family:var(--sans); color:var(--ink)}

/* Le quattro schermate dell'investigatore — avviso, riepilogo, verdetto,
   soluzione — hanno un corpo di testo solo. Prima ognuna aveva il suo, dal
   servizio piccolo dell'avviso alle righe grandi del riepilogo, e passando
   dall'una all'altra il testo saltava di misura. Centrato: la colonna e'
   centrata, e il testo e' poco. */
.avviso .detto p, .avviso .detto p:last-child,
.narr-fine .detto p, .narr-fine .detto p:last-child,
.giudizio h2, .giudizio p, .vuoto, .solution p{
  font-size:var(--t-voce); line-height:1.5;
  max-width:46ch; margin-inline:auto; text-align:center}
/* l'ultima riga resta oro, ma nel carattere delle altre: il serif la faceva
   leggere come un titolo in mezzo a un discorso */
.narr-fine p:last-child{color:var(--gold); margin-top:.6rem}

/* ---- l'ultima schermata: figura, racconto, congedo ---- */
.fine-caso{gap:clamp(1rem,3vh,2rem); align-items:center}
.fine-caso .guida img{max-height:64vh; max-width:min(100%,52rem)}

/* ---- il congedo, in coda alla soluzione ---- */
.congedo{display:flex; flex-direction:column; align-items:center; gap:1rem; margin-top:1.2rem}
.congedo .parola{font-family:var(--serif); font-size:var(--t-titolo); line-height:1; color:var(--gold); margin:0}

/* ---- copertina ---- */
.cover{text-align:center; display:flex; flex-direction:column; gap:1.1rem; align-items:center; padding:clamp(1rem,5vh,3rem) 0}
.cover h1{font-size:var(--t-titolo); line-height:.95; font-weight:700}
.cover h1 em{font-style:italic; color:var(--blu)}
.cover .sub{color:var(--muted); max-width:46ch}
.rule{width:min(18rem,60%); height:1px; background:var(--line)}
/* testo di servizio dell'investigatore: una riga di istruzioni, non copione */
.nota{max-width:60ch; color:var(--muted)}

/* ---- personaggi ---- */
/* un personaggio sotto l'altro, ritratto grande: sul telefono prende tutta la larghezza,
   su schermo largo lo limita l'altezza, cosi' il quadrato non diventa smisurato */
/* un personaggio per schermata: scorrendo si passa di netto al successivo */
/* sul telefono i ritratti vanno da bordo a bordo: il margine laterale del palco qui non serve */
#stage:has(.cast){scroll-snap-type:y mandatory; padding:0}
/* Le schede scorrono una per schermata; il foglio non si ferma alla loro
   altezza, perche' dopo l'ultima deve restare posto per il pulsante. Ogni
   scheda misura una schermata intera da se', invece di ereditarla. */
.sheet:has(.cast){height:auto; margin-block:0; gap:0}
.cast{display:flex; flex-direction:column; gap:0; width:100%}
/* ogni scheda ha il suo pulsante sotto al testo, sempre acceso: premuto prima
   dell'ultima porta al personaggio seguente, sull'ultima cambia schermata */
.card .azioni{justify-content:center; flex:none; padding-top:clamp(.4rem,1.6vh,1rem)}
.card{flex:none; height:100dvh; gap:clamp(.4rem,1.6vh,1rem); width:100%;
  padding:clamp(.75rem,2.5vh,1.6rem) 0; scroll-snap-align:start; scroll-snap-stop:always}
.dissolve .card{opacity:.25; transition:opacity .55s ease}
.dissolve .card.in{opacity:1}
/* Il movimento sta sul contenuto, mai sulla scheda: la scheda e' il punto a
   cui si aggancia lo snap, e il browser lo misura con la trasformazione
   dentro. Traslata di 2.5vh, lo snap si fermava 30px piu' in basso e poi la
   rincorreva mentre tornava a posto: lo scatto all'indietro a ogni ritratto. */
.dissolve .card > *{transform:translateY(2.5vh) scale(.97);
  transition:transform .55s cubic-bezier(.2,.7,.3,1)}
.dissolve .card.in > *{transform:none}
.card .titolo-carta{font-size:var(--t-nome); color:var(--speaker,var(--ink)); text-align:center;
  padding-inline:1rem}
.card p{margin:0; color:var(--muted); font-size:var(--t-corpo); line-height:1.45;
  text-align:center; max-width:40ch; padding-inline:1.25rem}
/* i ritratti sono quadrati: la casella li segue, cosi' niente vuoto attorno.
   Sul telefono la limita la larghezza, sul proiettore l'altezza. */
.card .ritratto{display:block; flex:0 1 auto; min-height:0;
  width:auto; height:auto; max-width:100%; max-height:100%}
.card .ph.ritratto{width:min(100%,60vh); font-size:clamp(5rem,22vh,12rem); opacity:.5}
.card .testo{display:contents}

/* ---- tavolo degli indizi ---- */
/* l'investigatore apre l'indagine accanto al titolo, con la lente in mano */
.apertura{display:flex; align-items:center; gap:clamp(1rem,3vw,2rem)}
.apertura .guida{flex:0 0 auto}
.apertura .guida img{display:block; width:auto; height:auto; max-width:min(30vw,11rem); max-height:22vh}
.apertura .guida .ph{width:6rem; font-size:2.4rem; opacity:.4}
.apertura .nota{margin-top:.4rem}
.clues{display:grid; gap:1rem; grid-template-columns:repeat(auto-fit,minmax(min(13rem,100%),1fr))}
.clue{padding:1.1rem 1rem; text-align:left; display:flex; flex-direction:column; gap:.4rem}
.clue .tag{font-size:.78em; color:var(--muted)}
.detail{border-color:var(--blu); padding:1.1rem 1.2rem; animation:rise .3s ease-out both}
.detail .titolo-carta{color:var(--blu); margin-bottom:.3rem}
.detail .refs{display:flex; flex-direction:column; gap:.55rem; margin-top:.9rem}
.detail figure .ph{aspect-ratio:1; place-items:center; color:var(--line)}
.detail figure .ph .leaf{width:38%; height:auto}

/* una scheda gia' scelta dice a chi si e' chiesto; una fuori portata non si apre */
.clue .stato{margin-top:.35rem; font-size:.78em; font-weight:700; color:var(--speaker,var(--gold))}
.chiedi{display:flex; flex-wrap:wrap; gap:.6rem; margin-top:.9rem}
/* Le persone a cui chiedere sono le stesse carte della scheda finale: si
   sceglie una faccia, non una parola. Qui in piu' c'e' lo stato — chi ha
   gia' risposto resta acceso col suo colore, chi non si puo' piu' interrogare
   si spegne. */
.opt.voce .v{color:var(--speaker,var(--ink)); font-weight:700}
.opt.voce.fatto{border-color:var(--speaker,var(--line));
  background:color-mix(in srgb,var(--speaker,var(--olive)) 18%,var(--surface))}
.opt.voce[disabled]{opacity:.35; cursor:not-allowed}
/* la risposta di un interrogato, e sotto cio' che aveva gia' detto in scena */
.risposta{border-left:3px solid var(--speaker,var(--line)); padding-left:.75rem}
.risposta .src{ letter-spacing:.1em; text-transform:uppercase; color:var(--speaker,var(--muted)); font-weight:700}
.risposta p{margin:.1rem 0}
.gia-detto{margin:.45rem 0 0; padding-left:1.1rem; color:var(--muted)}
.gia-detto li{margin:.1rem 0}
.clue .stato b{font-weight:700; color:var(--speaker,var(--gold))}

/* Un corpo di testo solo per tutta la sezione: prima erano sette misure fra
   titolo della scheda, etichetta, stato, descrizione, nota, nome di chi
   risponde e citazioni, e l'occhio non sapeva cosa venisse prima. Il titolo
   della pagina resta piu' grande: apre la schermata, non e' della lista. */
.indagine h2, .indagine h3, .indagine p, .indagine li,
.indagine .tag, .indagine .stato, .indagine .src, .indagine .opt .v{font-size:var(--indizi)}
/* il volto tondo accanto al nome: in `em`, cosi' segue il corpo qui sopra */
.volto-mini{width:1.8em; height:1.8em; flex:none; border-radius:50%; object-fit:cover;
  background:var(--surface-2)}
.ph-cifra.volto-mini{font-size:.9em; opacity:.55; border:1px solid var(--line)}
.slot.empty .ph-cifra.volto-mini{display:grid}
.risposta .src{display:inline-flex; align-items:center; gap:.5em}

/* ---- scheda finale: una pagina sola, le domande chiuse salgono ---- */
.domande{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:1rem}
.domande .fatta{display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; opacity:.45;
  padding-bottom:.9rem; border-bottom:1px solid var(--line)}
.domande .fatta .q{margin:0; flex:1 1 18rem; min-width:0}
.domande .fatta .data{margin:0; font-weight:700; color:var(--speaker,var(--olive)); white-space:nowrap}
.domande .corrente{animation:rise .32s ease-out both}
.quiz h2{font-size:var(--t-nome); margin:.2rem 0 1.2rem}
.opts{display:grid; gap:.9rem; grid-template-columns:repeat(auto-fit,minmax(min(14rem,100%),1fr))}
.opt{padding:1.1rem 1rem; display:flex; flex-direction:column; gap:.7rem; text-align:left}
.opt .riga{display:flex; gap:.8rem; align-items:center}
/* il volto sotto il nome: quattro facce in fila, si sceglie una persona */
.opt .volto{display:block; width:100%; max-width:9.5rem; margin-inline:auto; height:auto; aspect-ratio:1; object-fit:contain}
.opt .ph.volto{width:100%; max-width:9.5rem; margin-inline:auto; font-size:3rem; opacity:.45}
.opt .k{font-family:var(--serif); font-size:var(--t-voce); color:var(--gold); line-height:1}
.opt .v{font-size:var(--t-corpo)}

/* ---- soluzione ---- */
/* niente filetto e niente rientro: il racconto finale sta al centro della
   pagina, come tutto quello che ha intorno */
.solution{max-width:62ch}
.solution p{margin:.6rem 0}
.score{font-family:var(--serif); color:var(--gold); line-height:1}   /* la misura la da' il verdetto */
.score small{font-size:var(--t-corpo); color:var(--muted)}   /* «su 10»: e' testo, non cifra */
/* il verdetto in colonna: l'investigatore, il punteggio, il giudizio, il
   pulsante. La posa e' gia' meta' del verdetto, quindi sta in cima. */
.verdetto{gap:clamp(.8rem,2.5vh,1.6rem); align-items:center; text-align:center}
/* Verdetto e soluzione parlano come l'avviso: stesso carattere, stesso
   corpo, stesso peso, stesso grigio. Erano tre corpi e due caratteri per
   quattro righe — la cifra in Bodoni oro, il giudizio in Bodoni bianco, la
   spiegazione in Alegreya. Il punteggio tiene solo l'oro: e' l'unico numero
   della schermata e quello deve restare riconoscibile. */
.verdetto .score, .verdetto .score small, .verdetto h2, .verdetto p, .solution p{
  font-family:var(--sans); font-size:var(--t-voce); font-weight:400; color:var(--ink)}
.verdetto .score{color:var(--gold)}
.verdetto .guida img{max-height:64vh; max-width:min(100%,52rem)}
.verdetto .azioni{width:100%; justify-content:center}
.giudizio p{margin:.4rem 0 0; max-width:52ch}   /* il colore lo da' la regola dell'investigatore */
/* si arriva al verdetto senza aver risposto solo saltando col pannello: la
   pagina lo dice invece di restare bianca */
.vuoto{max-width:52ch}

/* ---- finestra dei comandi ---- */
#overlay{position:fixed; inset:0; background:color-mix(in srgb,var(--bg) 88%,#000); z-index:20;
  overflow-y:auto; padding:clamp(1rem,4vw,3rem); animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#overlay[hidden]{display:none}
.ov{max-width:60rem; margin:0 auto; display:flex; flex-direction:column; gap:1.1rem}
.ov-head{display:flex; align-items:baseline; gap:1rem}
/* la finestra di conferma: una domanda, due strade */
.conferma{max-width:34rem; margin:auto; text-align:center; align-items:center}
.conferma .guida{margin-bottom:.4rem}
/* la stessa misura dell'avviso: nelle finestre l'investigatore non rimpicciolisce */
.conferma .guida img{max-height:72vh; max-width:min(100%,44rem)}
.conferma .nota{margin-inline:auto}
.conferma .azioni{justify-content:center}
.conferma h2{font-size:var(--t-voce)}
.conferma .azioni{display:flex; gap:.8rem; flex-wrap:wrap; margin-top:.6rem}
.keys{display:grid; gap:.5rem; grid-template-columns:repeat(auto-fit,minmax(min(16rem,100%),1fr))}
.keys div{display:flex; gap:.6rem; align-items:baseline}

/* ---- il velo blu del malore ---- */
.stage-blu{position:relative}
.stage-blu::after{content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(115% 75% at 50% 55%,transparent 35%,color-mix(in srgb,var(--blu) 45%,transparent) 100%);
  animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.95}}

/* ---- immagini e palco (le riempie Codex; se mancano, ripiego tipografico) ---- */
.slot .ph{display:none}
.slot.empty .ph{display:block}
.clue.slot.empty .ph,.detail figure.slot.empty .ph{display:grid}
/* palco: lo sfondo sta sotto, i personaggi ritagliati sopra, chi parla viene avanti */
/* Il palco e' sempre quadrato: nessuna scena ha un formato suo. */
/* Il palco resta un quadrato — tutte le posizioni sono percentuali sue — ma
   le sue fasce si ritagliano via: sopra le figure c'e' soffitto, sotto il
   pavimento vuoto. Uguale su ogni schermo: la scena e' composta cosi', e non
   deve cambiare inquadratura secondo il dispositivo. Si taglia la cornice, non
   l'immagine: niente ingrandimento, niente lati persi, e la regia gia' decisa
   resta valida al millimetro. */
.palco{position:relative; height:100%; width:auto; max-width:100%; aspect-ratio:1;
  clip-path:inset(10% 0 10% 0);
  overflow:hidden; border:1px solid var(--line); border-radius:2px; box-shadow:var(--shadow)}
.palco .sfondo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:1px}
.palco .attore{position:absolute; width:auto; transform:translateX(-50%); transform-origin:bottom center;
  z-index:1; filter:brightness(.88); transition:transform .35s cubic-bezier(.2,.7,.3,1), filter .35s ease}
/* oggetti in primo piano: davanti agli attori, ancorati agli angoli bassi */
.palco .primo{position:absolute; width:auto; transform:translateX(-50%); z-index:5; pointer-events:none}
/* Chi parla cresce appena e resta in piena luce; gli altri arretrano di luminosita'.
   Nessun salto di z-index: l'ordine dei piani e' quello deciso in regia e non cambia. */
.palco .attore.attivo{
  transform:translateX(-50%) translateY(-1%) scale(1.03);
  filter:brightness(1.06) drop-shadow(0 .6vh 1.1vh rgba(0,0,0,.45))}
.slot.empty .palco{display:none}
.clue figure{margin:0 0 .2rem; border:1px solid var(--line); border-radius:2px; overflow:hidden; background:var(--surface-2)}
.clue figure img{display:block; width:100%; aspect-ratio:1; object-fit:cover}
/* la foglia e' il ripiego: `.slot .ph{display:none}` la tiene via finche'
   l'immagine carica, e `display:grid` qui la rimetteva sempre in mezzo */
.clue .ph{aspect-ratio:1; place-items:center; color:var(--line)}
.clue .ph .leaf{width:38%; height:auto}
.detail figure{float:right; width:min(38%,14rem); margin:0 0 .8rem 1.2rem; border:1px solid var(--line); border-radius:2px; overflow:hidden}
.detail figure img{display:block; width:100%; aspect-ratio:1; object-fit:cover}
.cover .plate{border:none; background:none; box-shadow:none; padding:0; width:auto;
  margin-inline:auto}
.cover .plate::before{display:none}
.cover .plate > img{width:auto; max-width:100%; max-height:34vh; object-fit:contain}
@media (max-width:640px){
  .detail figure{float:none; width:100%; margin:0 0 .8rem}
  }

/* ---- modalita' regia: si trascina, si ridimensiona, si copia il risultato ---- */
.palco.regia .attore,.palco.regia .primo{pointer-events:auto; cursor:grab; touch-action:none}
.palco.regia .sel{outline:2px dashed var(--gold); outline-offset:3px}
.palco.regia::after{content:"REGIA"; position:absolute; top:calc(10% + .4rem); left:.5rem; z-index:9;
  font-size:.62rem; letter-spacing:.18em; color:var(--gold);
  background:color-mix(in srgb,var(--bg) 75%,transparent); padding:.15rem .45rem; border-radius:2px}
/* La cassa comune ai due pannelli d'autore. L'identita' e' `.regia-pan` o
   `.dev-pan`: tenerle separate dall'aspetto evita che chi cerca il pannello di
   regia per toglierlo si porti via quello di sviluppo. */
.pannello{position:fixed; left:.7rem; right:.7rem; bottom:4.2rem; z-index:8; display:flex;
  flex-direction:column; gap:.5rem; border-radius:4px; padding:.7rem .8rem;
  max-width:min(94vw,44rem); margin-inline:auto; font-size:.8rem}
.pannello .riga{display:flex; align-items:center; gap:.5rem; flex-wrap:wrap}
.pannello b{color:var(--gold); font-weight:700}
/* semitrasparente: si tiene aperto mentre si prova, e sotto si vede la scena */
.dev-pan{opacity:.6; top:.7rem; bottom:auto; left:auto; right:6.4rem; width:min(34rem,80vw);
  margin-inline:0; font-size:.86rem; gap:.45rem}
/* l'elenco: una schermata per riga, si legge in colonna */
.dev-pan .salti{display:flex; flex-direction:column; gap:1px; max-height:70vh; overflow:auto}
.dev-pan .salti button{font:inherit; cursor:pointer; text-align:left; width:100%;
  display:flex; gap:.6rem; padding:.28rem .5rem; border-radius:2px;
  border:1px solid transparent; background:none; color:var(--muted)}
.dev-pan .salti button i{font-style:normal; min-width:1.3rem; text-align:right; opacity:.6}
.dev-pan .salti button:hover{color:var(--ink); border-color:var(--line)}
.dev-pan .salti button.qui{background:var(--gold); border-color:var(--gold); color:var(--bg)}
.dev-pan .salti button.qui i{opacity:.8}
.pannello textarea{width:100%; min-height:4.5rem; resize:vertical; border:1px solid var(--line);
  border-radius:2px; background:var(--bg); color:var(--ink); padding:.4rem .5rem;
  font-family:var(--mono); font-size:.72rem; line-height:1.5}

/* ---- adattamenti ---- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}
/* Col dito servono bersagli da 44px: col mouse no, e il proiettore resta com'e'.
   Anche la larghezza fa da spia, perche' `pointer:coarse` non si puo' provare
   in headless mentre una finestra stretta si'. */
@media (pointer:coarse),(max-width:700px){
  /* Su un telefono si legge a un braccio di distanza, non a due metri, ma non
     a un palmo: la radice cresce di poco e tutta la scala segue, perche' su
     schermo stretto dentro un `clamp()` vince quasi sempre il minimo in rem.
     Era 150%, con quattordici misure riscritte a mano sopra — sulla cornice
     da 390px sembrava giusto, ma il `<meta viewport>` mancava e su un telefono
     vero quelle regole non entravano mai in funzione. Con il viewport a posto
     il testo e' uscito enorme, e la pila di valori letterali e' sparita. */
  :root{font-size:112%}

  /* Col dito servono bersagli da 44px: col mouse no, e il proiettore resta
     com'e'. La larghezza fa da spia perche' `pointer:coarse` non si puo'
     provare in headless mentre una finestra stretta si'. */
  .btn{min-height:44px; padding-inline:1.2rem; max-width:100%}
  .volume .icona{font-size:2.2rem}
  .volume input{width:8rem; height:44px}
  .opt,.clue{min-height:44px}
  /* dove si sceglie, due colonne: quattro carte in fila sotto il pollice
     invece di quattro schermate di scorrimento */
  .clues,.opts{grid-template-columns:repeat(2,minmax(0,1fr)); gap:.7rem}
  /* il volume galleggia in alto a destra: su uno schermo stretto l'occhiello
     della scena gli finiva sotto. La colonna del titolo si stringe, cosi' il
     testo va a capo prima invece di passarci dietro. */
  /* il volume galleggia in alto a destra: il titolo va a capo prima di finirgli sotto */
  .scene-head{padding-right:12rem}

  /* col testo grande e il pulsante dentro la scheda, il ritratto restava alto
     98px: qui la scheda puo' crescere e il ritratto ha una quota sua */
  .card{height:auto; min-height:100dvh}
  .card .ritratto{height:40dvh; width:auto; max-width:100%; max-height:none}

  /* le quattro schermate dell'investigatore: testo giustificato, senza
     sillabazione — gli spazi si allargano, e va bene cosi' */
  .avviso .detto p, .avviso .detto p:last-child,
  .narr-fine .detto p, .narr-fine .detto p:last-child,
  .giudizio h2, .giudizio p, .vuoto, .solution p{text-align:justify}
}
@media (max-width:640px){
  .bubble{flex-direction:column; gap:.2rem}
  .who{width:auto; text-align:left}
  .said{border-radius:2px 10px 10px 10px}
}
</style>

      battute:[
        {c:"Giuseppe", m:"guardando la bottiglia d’olio", t:"Adoro l’olio. Ditemi una cosa, Augusto: come nasce davvero?"},
        {c:"Augusto", t:"La qualità comincia dalla raccolta: servono olive sane, al giusto grado di maturazione, portate presto al frantoio."},
        {c:"Roberto", t:"Prima si eliminano foglie e terra e si lavano le olive."},
        {c:"Augusto", t:"Poi arriva la frangitura: polpa e nocciolo vengono schiacciati e diventano una pasta."},
        {c:"Roberto", t:"Con la gramolatura la pasta viene mescolata lentamente, così le piccole gocce d’olio si uniscono."},
        {c:"Augusto", t:"Infine la centrifugazione separa l’olio dall’acqua e dalla sansa. Poi può essere filtrato."},
        {c:"Giuseppe", t:"E quando possiamo chiamarlo extravergine?"},
        {c:"Roberto", t:"Quando supera sia le analisi sia l’assaggio: nessun difetto, profumo fruttato e acidità entro i limiti. L’acidità da sola non basta."},
        {c:"Augusto", t:"E anche l’olio migliore va protetto da luce, aria e calore."}

        {c:"Augusto", t:"Usciamo un momento. L’oliveto, al tramonto, merita di essere visto."},
        {c:"Augusto", t:"A chi non la conosce, presento mia moglie: Elisa Lanzillotta, pittrice."},
        {c:"Elisa", t:"Piacere. Qui fuori, a quest’ora, la luce sugli ulivi è perfetta."},
        {c:"Giuseppe", t:"Elisa, finalmente ci rivediamo fuori dal suo studio!"},
        {c:"Elisa", t:"Qui almeno non dovrà stare immobile, signor Giuseppe. Può godersi il tramonto."},
        {c:"Andrea", t:"Andrea Leuzzi. Studio all’università, e sono anch’io degli Oliviani: quando posso vengo qui a respirare un po’ di campagna."},
        {c:"Giuseppe", t:"Andrea, che piacere vederti. Sei arrivato giusto in tempo."},
        {c:"Andrea", t:"Non me lo sarei perso per niente al mondo, Giuseppe."},
        {c:"Rosalia", t:"Zio, vi conoscete già?"},
        {c:"Giuseppe", t:"Andrea mi aiuta con i libri e con le carte. Ha molta pazienza con un vecchio come me."},
        {c:"Andrea", t:"Vecchio? Non dirlo nemmeno per scherzo."},
        {c:"Mauro", m:"piano", t:"Gli dà del tu."},
        {c:"Rosalia", m:"piano", t:"Lascia stare, Mauro."},
        {c:"Rosalia", m:"a Giuseppe", t:"Non voglio decidere dei tuoi soldi. Vorrei capire perché una scelta così grande l’hai raccontata prima a loro che a me."},
        {c:"Giuseppe", t:"Avrei dovuto parlartene prima, hai ragione. Ma non sto rinunciando a voi."}

        {c:"Giuseppe", t:"Elisa, a che punto è il mio ritratto?"},
        {c:"Elisa", t:"Ho dovuto metterlo un poco da parte, mi scusi. Avevo altri lavori rimasti indietro."},
        {c:"Elisa", t:"Ad Augusto ne ho già consegnati due, solo quest’anno."},
        {c:"Elisa", t:"E tutti e due me li ha chiesti con urgenza."},
        {c:"Augusto", t:"Uno era per la sala degli Oliviani. Serviva per stasera."},
        {c:"Elisa", t:"Il suo arriverà, signor Giuseppe, glielo prometto. Un ritratto non si fa di corsa."},
        {c:"Giuseppe", t:"Lo so bene. Volevo solo vederlo finito in tempo."},
        {c:"Giuseppe", m:"con garbo", t:"Anche perché l’anticipo gliel’ho versato in primavera."},
        {c:"Elisa", t:"Non l’ho dimenticato, signor Giuseppe. Glielo assicuro."},
        {c:"Andrea", t:"Ne varrà la pena. Certi volti meritano tempo."},
        {c:"Giuseppe", m:"sorridendo", t:"Sei sempre troppo gentile, Andrea."},
        {c:"Elisa", t:"Ha ragione il ragazzo. Lei ha un viso che racconta molte cose."},
        {c:"Andrea", t:"E uno sguardo che non si dimentica."},
        {c:"Giuseppe", t:"Basta così, o finisco per arrossire davanti a tutti."},
        {c:"Andrea", t:"Le è rimasto un poco di colore sulle dita, Elisa."},
        {c:"Elisa", t:"Oltremare. Ho ritoccato il quadro della sala fino a un’ora fa."},
        {c:"Giuseppe", m:"piano, a Elisa", t:"Le sue mani mi piacciono anche così, sporche di colore."},
        {c:"Elisa", m:"piano", t:"Signor Giuseppe, ci stanno guardando tutti."},
        {c:"Andrea", m:"freddo", t:"Giuseppe, ti aspettano sul sentiero."}

        {c:"Elisa", t:"Guardate le foglie quando si muove il vento: sopra sono verdi, sotto quasi d’argento."},
        {c:"Augusto", t:"È la loro difesa. Quella peluria chiara limita la perdita d’acqua e le ripara dal sole."},
        {c:"Augusto", t:"In Puglia ci sono ulivi che hanno visto passare secoli. Alcuni hanno più di mille anni."},
        {c:"Elisa", t:"Anche Van Gogh dipinse gli ulivi, più di una volta. Diceva che erano difficilissimi da rendere."},
        {c:"Andrea", t:"Allora il ritratto di Giuseppe dovrebbe avere un ulivo alle spalle."},
        {c:"Giuseppe", t:"Un ulivo e un po’ di questa luce. Mi piacerebbe."},
        {c:"Elisa", t:"Allora lo dipingerò così. Ma ci vorrà ancora un po’."},
        {c:"Giuseppe", t:"Mi dica lei quando posare. Per lei libero qualunque sera."},
        {c:"Elisa", t:"Le sere le tengo per mio marito, signor Giuseppe. Le darò un mattino, con la luce giusta."},
        {c:"Andrea", m:"piano, a Giuseppe", t:"Io aspetto volentieri. Basta che ci sia anche tu, quando sarà finito."},
        {c:"Giuseppe", m:"piano", t:"Ci sarò, Andrea. Te lo prometto."},
        {c:"Rosalia", m:"a Mauro", t:"Mio zio non mi aveva mai parlato di lui."},
        {c:"Mauro", t:"Tuo zio non ti dice molte cose."},
        {c:"Rosalia", t:"Prima l’ho visto uscire dallo studio con le carte dello zio in mano."},
        {c:"Mauro", t:"Allora chiediti cosa c’era scritto."}

        {c:"Mauro", m:"restituendo la chiave a Roberto", t:"Ecco la chiave. Ho sistemato tutto."},
        {c:"Mauro", t:"Signor Giuseppe, un brindisi per questo nuovo inizio."},
        {c:"Giuseppe", t:"Volentieri. Alla vostra comunità."},
        {c:"Andrea", t:"E a chi ci ha portati fin qui, stasera."},
        {c:"Giuseppe", m:"piano", t:"A te, allora."},
        {c:"Roberto", m:"sullo sfondo", t:"Un buon olio racconta il territorio da cui nasce."},
        {c:"Augusto", t:"E racconta anche il lavoro di chi cura gli ulivi."},
        {c:"Giuseppe", t:"E quali olive danno carattere agli oli pugliesi?"},
        {c:"Roberto", t:"Qui nel Brindisino l’Ogliarola dà oli delicati, con note di foglia, erba e carciofo."},
        {c:"Augusto", t:"La Cellina di Nardò ricorda il pomodoro e i frutti di bosco; la Coratina è più intensa, amara e piccante."},
        {c:"Giuseppe", t:"Tre olive, tre voci diverse della stessa terra."},
        {c:"Giuseppe", t:"Dov’è finita Elisa? Speravo di brindare accanto a lei."},
        {c:"Augusto", t:"È andata a lavarsi le mani. Ci raggiunge tra poco."},
        {c:"Andrea", m:"piano", t:"Accanto a te c’ero io, Giuseppe."},
        {c:"Roberto", m:"piano, ad Augusto", t:"E il rendiconto? Giuseppe lo chiederà presto."},
        {c:"Augusto", m:"piano", t:"Avrà tutto. Te l’ho detto."},
        {c:"Giuseppe", t:"Ho firmato l’impegno, Rosalia. Il versamento aspetterà il controllo dei conti, ma la mia decisione è presa."},

        {c:"Mauro", m:"tra sé", t:"Una firma non chiude ogni discorso."}

                           // nome atteso -> URL reale (artifact pubblicato, o nome diverso)

   chiedere di un nome che potrebbe non essere mai stato dichiarato. */
const IMAGES = typeof ASSETS === "undefined" ? {} : ASSETS;
