name: Smoke

on: [push, pull_request]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node smoke.js

  browser:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and Python for checks
        run: apt-get update && apt-get install -y --no-install-recommends chromium python3 python3-pil
      - run: python3 prova-regia.py
      - run: python3 prova-regia.py --script censimento.js --viewport 1280x900
      - run: python3 prova-regia.py --script censimento.js --viewport 390x844
      - run: python3 prova-regia.py --script audit-mobile.js --viewport 390x844
      - run: python3 prova-sync.py
